<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายการคดี | กองบริหารคดี | E-CMIS</title>
  <link rel="icon" type="image/png" href="assets/pacc_logo.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="assets/ecmis-app.css" rel="stylesheet">
  <link href="assets/a4-ecmis-workspace.css" rel="stylesheet">
  <style>
    .kpi-card { transition: all 0.2s ease; cursor: pointer; }
    .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(15, 42, 98, 0.12); }
    .kpi-card.active { outline: 2px solid #0F2A62; outline-offset: 1px; }
  </style>
</head>

<body>

  <main class="app-main">

    <div class="page-head d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
      <div>
        <h1><i class="fa-solid fa-folder-tree me-2" style="color:#0F2A62"></i><span>รายการคดี</span></h1>
      </div>
      <div class="d-flex align-items-center gap-3 ms-auto">
        <span class="flow-ref">กองบริหารคดี (กลุ่มงานบริหารคดีและบริหารทั่วไป) — ด่านรับ: ลงทะเบียนคุมคดี · เตรียมสำนวน · ส่งเข้าคณะอนุกลั่นกรองฯ</span>
      </div>
    </div>

    <!-- Queue Switcher: 2 คิวงานที่แยกกันชัดเจน — "คัดกรองความยุ่งยากก่อนประธานฯ" (ใหม่ 2026-09-17)
         กับ "กระจายเข้าคณะอนุกลั่นกรองฯ" (เดิม) ห้ามปนกัน เพราะเป็นคนละขั้นตอนของงาน -->
    <div class="btn-group mb-3" role="group" id="queueSwitcher">
      <button type="button" class="btn btn-outline-primary btn-sm px-3" data-queue="ROUTE">
        <i class="fa-solid fa-share-from-square me-1"></i>กระจายเข้าคณะอนุกลั่นกรองฯ
        <span class="badge bg-secondary ms-1" id="cntRoute">0</span>
      </button>
      <button type="button" class="btn btn-outline-primary btn-sm px-3" data-queue="COMPLEXITY">
        <i class="fa-solid fa-scale-unbalanced me-1"></i>คัดกรองความยุ่งยาก (ก่อนประธานฯ)
        <span class="badge bg-warning text-dark ms-1" id="cntComplexity">0</span>
      </button>
    </div>

    <!-- KPI Cards Row -->
    <div class="row g-3 mb-4" id="kpiRow"></div>

    <!-- Filter Bar -->
    <div class="card card-ecmis mb-4">
      <div class="card-body p-3">
        <div class="row g-3 align-items-end">
          <div class="col-md-5">
            <label class="form-label fw-semibold text-dark small mb-1">ค้นหาเลขคดี เรื่อง หรือผู้ถูกกล่าวหา</label>
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
              <input type="text" id="searchInput" class="form-control"
                placeholder="เลขคดี, เรื่อง, ผู้ถูกกล่าวหา, ผู้รับผิดชอบ, หน่วยงาน">
            </div>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold text-dark small mb-1"><i
                class="fa-solid fa-pen-to-square me-1 text-muted"></i>ประเภทเรื่อง</label>
            <select id="typeFilter" class="form-select form-select-sm">
              <option value="ALL">ทั้งหมด</option>
              <option value="7.1">ไต่สวนเบื้องต้น</option>
              <option value="7.2">วินิจฉัยชี้มูล</option>
            </select>
          </div>
          <div class="col-md-3 text-end">
            <button type="button" class="btn btn-sm btn-outline-secondary py-1 px-3 w-100" id="btnClearFilter">
              <i class="fa-solid fa-rotate-left me-1"></i>ล้างตัวกรอง
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="card card-ecmis mb-4">
      <div class="card-header d-flex align-items-center flex-wrap gap-2">
        <i class="fa-solid fa-list-check text-primary"></i>
        <span class="fw-bold" id="tableTitle">คิวสำนวนรอส่งเข้าคณะอนุกลั่นกรองฯ</span>
        <span class="ms-auto small text-muted" id="myRoleLabel">บทบาท: กองบริหารคดี</span>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover tbl-ecmis mb-0 align-middle">
            <thead>
              <tr>
                <th class="sortable-header" data-sort="id" style="cursor:pointer">เรื่องที่ <i
                    class="fa-solid fa-sort-down ms-1" style="font-size:0.75rem"></i></th>
                <th>ประเภทเรื่อง</th>
                <th>เรื่องกล่าวหา / ผู้รับผิดชอบ</th>
                <th id="thAssignCol">คณะที่มอบหมาย</th>
                <th class="sortable-header" data-sort="slaDays" style="cursor:pointer">กำหนดเวลา <i
                    class="fa-solid fa-sort ms-1" style="font-size:0.75rem"></i></th>
                <th class="text-end">ดำเนินการ</th>
              </tr>
            </thead>
            <tbody id="caQueue"></tbody>
          </table>
        </div>
        <div class="px-3 py-2 border-top d-flex align-items-center justify-content-between flex-wrap gap-2">
          <div class="small text-muted" id="tableSummaryText">แสดง 0 ถึง 0 จาก 0 รายการ</div>
          <nav aria-label="Case queue navigation" class="ms-auto">
            <ul class="pagination pagination-sm m-0" id="caPagination"></ul>
          </nav>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/ecmis-app.js"></script>
  <script src="assets/ecmis-model.js"></script>
  <script>
    ECMIS.renderShell('case-admin-inbox.html');

    const role = ECMIS.currentRole();
    $('#myRoleLabel').text('บทบาท: ' + (role.group || 'กองบริหารคดี'));

    /* ---------- โหลดสำนวนจาก Supabase / Local Data (เดียวกับ resolution-inbox.html) ---------- */
    const SUPABASE_URL = 'https://ljhabbwjxnoucrcrsoii.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_2Bps-dWMZHz_7cs3BppF6A_ul1_A_xd';
    let sb = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        sb = (window.ECMIS && window.ECMIS.getSupabaseClient) ? window.ECMIS.getSupabaseClient(SUPABASE_URL, SUPABASE_KEY) : window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
      }
    } catch (e) {
      console.warn('Supabase init skipped, using local data store:', e);
    }

    async function loadCasesFromSupabase() {
      if (!sb) return null;
      try {
        const { data, error } = await sb
          .from('tbl_res_request')
          .select('*, tbl_cmp_case(*, tbl_cmp_case_accused(*))')
          .eq('is_deleted', false);
        if (error) throw error;
        return data.map(row => ECMIS.supabaseRowToCase(row)).filter(Boolean);
      } catch (err) {
        console.warn('Supabase fetch failed, falling back to local CASES:', err);
        return null;
      }
    }

    const SCREEN = ECMIS.CASE_ADMIN_SCREEN_STATUSES; // ['IN_SCREENING','IN_SCREENING_72']
    const COMPLEXITY = ECMIS.CASE_ADMIN_COMPLEXITY_STATUSES; // ['PENDING_CASE_ADMIN_SCREEN','PENDING_CASE_ADMIN_SCREEN_72']
    let CASES = ECMIS.CASES.slice();
    let queueMode = 'ROUTE'; // 'ROUTE' (เดิม: กระจายเข้าคณะ) | 'COMPLEXITY' (ใหม่: คัดกรองความยุ่งยาก)
    let kpiFilter = 'WAIT';
    let sortField = 'id', sortOrder = 'asc';
    let currentPage = 1;
    const pageSize = 10;

    function overdue(c) { return (c.slaDays || 0) >= (c.slaLimit || 15); }

    /* ขอบเขตงานจริงของกองบริหารคดี แยกเป็น 2 คิวคนละขั้นตอน:
       - ROUTE: สำนวนที่อยู่ชั้นกลั่นกรองแล้ว (IN_SCREENING/IN_SCREENING_72) รอกระจายเข้าคณะ 1-8 (งานเดิม)
       - COMPLEXITY: สำนวนที่เลขาธิการฯ ลงนามปกติแล้ว รอ กบค. คัดกรองความยุ่งยากก่อนถึงประธานฯ (ใหม่ 2026-09-17)
       ทั้ง KPI และตารางอิงคิวที่เลือกอยู่เสมอ ห้ามปนสถานะสองกลุ่มนี้เข้าด้วยกัน */
    function statusesForQueue() { return queueMode === 'COMPLEXITY' ? COMPLEXITY : SCREEN; }
    function baseCases() {
      const statuses = statusesForQueue();
      return CASES.filter(c => ECMIS.canViewCase(c, role.id) && statuses.includes(c.status));
    }

    function updateQueueCounts() {
      const routeN = CASES.filter(c => ECMIS.canViewCase(c, role.id) && SCREEN.includes(c.status)).length;
      const complexityN = CASES.filter(c => ECMIS.canViewCase(c, role.id) && COMPLEXITY.includes(c.status)).length;
      $('#cntRoute').text(routeN);
      $('#cntComplexity').text(complexityN);
      $('#queueSwitcher .btn').removeClass('active btn-primary').addClass('btn-outline-primary');
      $(`#queueSwitcher .btn[data-queue="${queueMode}"]`).addClass('active btn-primary').removeClass('btn-outline-primary');
      $('#thAssignCol').text(queueMode === 'COMPLEXITY' ? 'ผลคัดกรอง' : 'คณะที่มอบหมาย');
    }

    function renderKPI() {
      const rows = baseCases();
      const cards = queueMode === 'COMPLEXITY' ? [
        { key: 'ALL', n: rows.length, label: 'รอคัดกรองความยุ่งยากทั้งหมด', icon: 'fa-folder-open', color: '#0F2A62' },
        { key: 'WAIT', n: rows.filter(c => ECMIS.isCaseAdminComplexityQueue(c)).length, label: 'รอคัดกรอง', icon: 'fa-hourglass-half', color: '#D0A830' },
        { key: 'OVERDUE', n: rows.filter(overdue).length, label: 'เกินกำหนด', icon: 'fa-triangle-exclamation', color: '#B91C1C' }
      ] : [
        { key: 'ALL', n: rows.length, label: 'คดีในชั้นกลั่นกรองทั้งหมด', icon: 'fa-folder-open', color: '#0F2A62' },
        { key: 'WAIT', n: rows.filter(c => ECMIS.isCaseAdminQueue(c)).length, label: 'รอส่งเข้าคณะ', icon: 'fa-hourglass-half', color: '#D0A830' },
        { key: 'ROUTED', n: rows.filter(c => ECMIS.caseAdminRouted(c)).length, label: 'ส่งเข้าคณะแล้ว', icon: 'fa-share-from-square', color: '#15803D' },
        { key: 'OVERDUE', n: rows.filter(overdue).length, label: 'เกินกำหนด', icon: 'fa-triangle-exclamation', color: '#B91C1C' }
      ];

      document.getElementById('kpiRow').innerHTML = cards.map(k => `
        <div class="col">
          <div class="card card-ecmis kpi-card h-100 ${kpiFilter === k.key ? 'active' : ''}" data-kpi="${k.key}">
            <div class="card-body p-3 d-flex align-items-center justify-content-between">
              <div>
                <div class="text-muted small mb-1">${k.label}</div>
                <div class="h3 fw-bold mb-0" style="color:${k.color}">${k.n}</div>
              </div>
              <div class="rounded-circle p-3 d-flex align-items-center justify-content-center"
                   style="background:${k.color}15; width:48px; height:48px;">
                <i class="fa-solid ${k.icon} fs-5" style="color:${k.color}"></i>
              </div>
            </div>
          </div>
        </div>`).join('');

      $('#kpiRow .kpi-card').on('click', function () {
        kpiFilter = $(this).data('kpi') === 'ALL' ? 'ALL' : $(this).data('kpi');
        currentPage = 1;
        renderKPI();
        render();
      });
    }

    const TABLE_TITLE_BY_FILTER = {
      ALL: 'ทะเบียนคุมคดี — ชั้นกลั่นกรองทั้งหมด',
      WAIT: 'คิวสำนวนรอส่งเข้าคณะอนุกลั่นกรองฯ',
      ROUTED: 'ทะเบียนคุมคดี — ส่งเข้าคณะแล้ว',
      OVERDUE: 'ทะเบียนคุมคดี — เกินกำหนด (ชั้นกลั่นกรอง)'
    };
    const TABLE_TITLE_BY_FILTER_COMPLEXITY = {
      ALL: 'ทะเบียนคุมคดี — รอคัดกรองความยุ่งยากทั้งหมด',
      WAIT: 'คิวสำนวนรอคัดกรองความยุ่งยาก (ก่อนถึงประธานฯ)',
      OVERDUE: 'ทะเบียนคุมคดี — เกินกำหนด (รอคัดกรองความยุ่งยาก)'
    };

    function render() {
      const titleMap = queueMode === 'COMPLEXITY' ? TABLE_TITLE_BY_FILTER_COMPLEXITY : TABLE_TITLE_BY_FILTER;
      $('#tableTitle').text(titleMap[kpiFilter] || titleMap.ALL);
      const q = ($('#searchInput').val() || '').trim().toLowerCase();
      const type = $('#typeFilter').val() || 'ALL';

      let rows = baseCases().filter(c => {
        const pt = c.procType || (ECMIS.isCase72(c) ? '7.2' : '7.1');
        if (type !== 'ALL' && !pt.startsWith(type)) return false;
        if (kpiFilter === 'OVERDUE' && !overdue(c)) return false;
        if (queueMode === 'COMPLEXITY') {
          if (kpiFilter === 'WAIT' && !ECMIS.isCaseAdminComplexityQueue(c)) return false;
        } else {
          if (kpiFilter === 'WAIT' && !ECMIS.isCaseAdminQueue(c)) return false;
          if (kpiFilter === 'ROUTED' && !ECMIS.caseAdminRouted(c)) return false;
        }
        if (!q) return true;
        return [c.id, c.subject, c.owner, c.ownerOrg].some(v => v && v.toLowerCase().includes(q))
          || (c.accused || []).some(a => a.name && a.name.toLowerCase().includes(q));
      });

      rows.sort((a, b) => {
        let va = a[sortField], vb = b[sortField];
        if (typeof va === 'string') return sortOrder === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
        return sortOrder === 'asc' ? ((va || 0) - (vb || 0)) : ((vb || 0) - (va || 0));
      });

      const totalItems = rows.length;
      const totalPages = Math.ceil(totalItems / pageSize) || 1;
      if (currentPage > totalPages) currentPage = totalPages;
      const startIdx = (currentPage - 1) * pageSize;
      const pagedRows = rows.slice(startIdx, startIdx + pageSize);

      $('#tableSummaryText').text(totalItems
        ? `แสดง ${startIdx + 1} ถึง ${Math.min(startIdx + pageSize, totalItems)} จาก ${totalItems} รายการ`
        : 'แสดง 0 ถึง 0 จาก 0 รายการ');

      renderPagination(totalPages);

      if (!pagedRows.length) {
        $('#caQueue').html(`<tr><td colspan="6" class="text-center py-4 text-muted">
          <i class="fa-solid fa-folder-open fa-2x mb-2 d-block text-secondary"></i>ไม่พบสำนวนตามเงื่อนไขที่เลือก</td></tr>`);
        return;
      }

      $('#caQueue').html(pagedRows.map(c => {
        let teamCell, actionBtn;
        if (queueMode === 'COMPLEXITY') {
          teamCell = `<span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle">— รอคัดกรอง</span>`;
          actionBtn = `<button class="btn btn-sm btn-navy px-3 btn-screen-complexity" data-id="${encodeURIComponent(c.id)}"><i class="fa-solid fa-scale-unbalanced me-1"></i>คัดกรองความยุ่งยาก</button>`;
        } else {
          const inScreen = SCREEN.includes(c.status);
          teamCell = c.subCommittee
            ? `<span class="badge bg-success-subtle text-success border border-success-subtle">${c.subCommittee}</span>`
            : (inScreen ? `<span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle">— รอส่งเข้าคณะ</span>`
              : `<span class="text-muted small">—</span>`);
          actionBtn = ECMIS.isCaseAdminQueue(c)
            ? `<button class="btn btn-sm btn-navy px-3 btn-route" data-id="${encodeURIComponent(c.id)}"><i class="fa-solid fa-share-from-square me-1"></i>ส่งเข้าคณะ</button>`
            : `<a href="case-admin-detail.html?case=${encodeURIComponent(c.id)}" class="btn btn-sm btn-outline-secondary px-3"><i class="fa-solid fa-eye me-1"></i>ดูรายละเอียด</a>`;
        }
        return `<tr>
          <td class="case-no">${c.id}</td>
          <td>${ECMIS.typeBadge(c)}</td>
          <td style="max-width:360px">
            <div class="text-truncate fw-medium" title="${c.subject || ''}">${c.subject || ''}</div>
            <small class="text-muted d-block text-truncate" style="font-size:0.75rem">${c.owner ? c.owner + ' · ' : ''}${c.ownerOrg || ''}</small>
          </td>
          <td>${teamCell}</td>
          <td>${ECMIS.slaBadge(c)}</td>
          <td class="text-end">${actionBtn}</td>
        </tr>`;
      }).join(''));

      $('#caQueue .btn-route').on('click', function () {
        openRouteModal(decodeURIComponent($(this).data('id')));
      });
      $('#caQueue .btn-screen-complexity').on('click', function () {
        openComplexityModal(decodeURIComponent($(this).data('id')));
      });
    }

    function renderPagination(totalPages) {
      const ul = document.getElementById('caPagination');
      let html = `
        <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
          <a class="page-link" href="#" onclick="changeCaPage(${currentPage - 1}); return false;">«</a>
        </li>`;
      for (let i = 1; i <= totalPages; i++) {
        html += `
          <li class="page-item ${currentPage === i ? 'active' : ''}">
            <a class="page-link" href="#" onclick="changeCaPage(${i}); return false;">${i}</a>
          </li>`;
      }
      html += `
        <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
          <a class="page-link" href="#" onclick="changeCaPage(${currentPage + 1}); return false;">»</a>
        </li>`;
      ul.innerHTML = html;
    }

    function changeCaPage(p) {
      currentPage = p;
      render();
    }

    /* ── modal: ส่งเข้าคณะอนุกลั่นกรองฯ ─────────────────────────────── */
    function openRouteModal(caseId) {
      const kase = CASES.find(c => c.id === caseId);
      if (!kase) return;
      const load = ECMIS.subcommitteeActiveLoad(CASES);
      const suggested = ECMIS.nextSubcommitteeTeam(CASES);
      const opts = ECMIS.SUBCOMMITTEE_TEAMS.map(t =>
        `<option value="${t}" ${t === suggested ? 'selected' : ''}>${t} — ค้าง ${load[t]} สำนวน${t === suggested ? ' (น้อยสุด)' : ''}</option>`
      ).join('');
      Swal.fire({
        title: 'ส่งเข้าคณะอนุกลั่นกรองฯ',
        html: `<div class="text-start small">
            <div class="mb-2">สำนวน <strong>${kase.id}</strong> — ${ECMIS.isCase72(kase) ? 'วินิจฉัยชี้มูล' : 'ไต่สวนเบื้องต้น'}</div>
            <label class="form-label fw-semibold">เลือกคณะอนุกลั่นกรองฯ</label>
            <select id="swTeam" class="form-select form-select-sm mb-2">${opts}</select>
            <div class="text-muted mb-2">ระบบเสนอ <strong>${suggested}</strong> — คณะที่มีสำนวนค้างระหว่างกลั่นกรองน้อยที่สุด</div>
            <label class="form-label fw-semibold">หมายเหตุ / เหตุผลกรณีเลือกคณะเอง</label>
            <textarea id="swReason" class="form-control form-control-sm" rows="2" placeholder="ระบุเหตุผลหากไม่ใช้คณะที่ระบบเสนอ"></textarea>
          </div>`,
        showCancelButton: true,
        confirmButtonText: 'ยืนยันส่งเข้าคณะ',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#0F2A62',
        preConfirm: () => {
          const team = document.getElementById('swTeam').value;
          const reason = document.getElementById('swReason').value.trim();
          if (team !== suggested && !reason) {
            Swal.showValidationMessage('กรุณาระบุเหตุผลเมื่อเลือกคณะที่ไม่ใช่คณะที่ระบบเสนอ');
            return false;
          }
          return { team, reason };
        }
      }).then(res => {
        if (!res.isConfirmed) return;
        const { team, reason } = res.value;
        ECMIS.pushCaseHistory(kase, {
          event: 'ROUTE_TO_SUBCOMMITTEE', from: kase.status, to: kase.status, team,
          note: `กระจายสำนวนเข้า ${team}${team === suggested ? ' (Round-Robin)' : ' (เลือกโดย กบค.)'}${reason ? ' — ' + reason : ''}`
        });
        const routedAt = new Date().toISOString();
        kase.subCommittee = team;
        kase.routedByCaseAdminAt = routedAt;
        ECMIS.Model.CaseStore.update(kase.id, { subCommittee: team, routedByCaseAdminAt: routedAt, history: kase.history });
        if (sb && kase.trr_id) {
          sb.from('tbl_res_request').update({ trr_sub_committee: team }).eq('trr_id', kase.trr_id)
            .then(({ error }) => { if (error) console.warn('บันทึกคณะที่มอบหมายลง Supabase ไม่สำเร็จ:', error); });
        }
        ECMIS.toastOk(`ส่งสำนวน ${kase.id} เข้า ${team} เรียบร้อย`);
        renderKPI(); render(); updateQueueCounts();
      });
    }

    /* ── modal: คัดกรองความยุ่งยาก (gate ใหม่ 2026-09-17 ก่อนถึงประธานฯ) ──────────────
       ยุ่งยาก → SCREEN_COMPLEX(_72) เข้า IN_SCREENING(_72) เหมือนเดิม (ข้ามประธานฯ)
       ไม่ยุ่งยาก → SCREEN_ASSIGN(_72) เข้า PENDING_CHAIRMAN_ASSIGN(_72) — ต้องกรอกความเห็นเสนอ
       เพราะจะถูกใช้เป็น kase.subOpinion ให้ chairman-agenda.html แสดงตอนประธานฯ ลงนามมอบหมาย */
    function openComplexityModal(caseId) {
      const kase = CASES.find(c => c.id === caseId);
      if (!kase) return;
      const is72 = ECMIS.isCase72(kase);
      Swal.fire({
        title: 'คัดกรองความยุ่งยากของสำนวน',
        html: `<div class="text-start small">
            <div class="mb-3">สำนวน <strong>${kase.id}</strong> — ${is72 ? 'วินิจฉัยชี้มูล' : 'ไต่สวนเบื้องต้น'}</div>
            <label class="form-label fw-semibold d-block mb-2">ผลการคัดกรอง</label>
            <div class="form-check mb-1">
              <input class="form-check-input" type="radio" name="caComplex" id="caComplexYes" value="YES" checked>
              <label class="form-check-label" for="caComplexYes">ยุ่งยาก — ส่งเข้าคณะอนุกลั่นกรองฯ คณะที่ ๑–๘ (ข้ามประธานฯ ไปก่อน)</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="caComplex" id="caComplexNo" value="NO">
              <label class="form-check-label" for="caComplexNo">ไม่ยุ่งยาก — ทำความเห็นเสนอประธานฯ ลงนามมอบหมาย (ทางลัด)</label>
            </div>
            <div id="caOpinionWrap" class="d-none">
              <label class="form-label fw-semibold">ความเห็นเสนอ <span style="color:#DB2626">*</span></label>
              <textarea id="caOpinion" class="form-control form-control-sm" rows="3" placeholder="ระบุความเห็นเสนอประธานฯ พิจารณาสั่งการ (ใช้แทนความเห็นคณะอนุกลั่นกรองฯ ในเส้นทางนี้)"></textarea>
            </div>
          </div>`,
        showCancelButton: true,
        confirmButtonText: 'ยืนยันผลคัดกรอง',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#0F2A62',
        didOpen: () => {
          const toggle = () => document.getElementById('caOpinionWrap').classList.toggle('d-none', document.getElementById('caComplexNo').checked === false);
          document.getElementById('caComplexYes').addEventListener('change', toggle);
          document.getElementById('caComplexNo').addEventListener('change', toggle);
        },
        preConfirm: () => {
          const complex = document.getElementById('caComplexYes').checked;
          const opinion = (document.getElementById('caOpinion').value || '').trim();
          if (!complex && !opinion) {
            Swal.showValidationMessage('กรุณากรอกความเห็นเสนอเมื่อคัดกรองว่าไม่ยุ่งยาก');
            return false;
          }
          return { complex, opinion };
        }
      }).then(res => {
        if (!res.isConfirmed) return;
        const { complex, opinion } = res.value;
        const fromStatus = kase.status;
        let updates;
        if (complex) {
          const nextStatus = is72 ? 'IN_SCREENING_72' : 'IN_SCREENING';
          ECMIS.pushCaseHistory(kase, {
            event: is72 ? 'SCREEN_COMPLEX_72' : 'SCREEN_COMPLEX', from: fromStatus, to: nextStatus,
            note: 'กบค. คัดกรองว่าสำนวนยุ่งยาก — ส่งเข้าคณะอนุกลั่นกรองฯ (ข้ามขั้นตอนประธานฯ)'
          });
          updates = { status: nextStatus, history: kase.history };
        } else {
          const nextStatus = is72 ? 'PENDING_CHAIRMAN_ASSIGN_72' : 'PENDING_CHAIRMAN_ASSIGN';
          ECMIS.pushCaseHistory(kase, {
            event: is72 ? 'SCREEN_ASSIGN_72' : 'SCREEN_ASSIGN', from: fromStatus, to: nextStatus,
            note: 'กบค. คัดกรองว่าไม่ยุ่งยาก — เสนอความเห็นให้ประธานฯ ลงนามมอบหมาย (ทางลัด ไม่ผ่านคณะอนุกลั่นกรอง)'
          });
          updates = { status: nextStatus, subOpinion: opinion, subCommittee: null, directAssign: true, history: kase.history };
        }
        const { status: nextStatus, ...rest } = updates;
        Object.assign(kase, rest);
        ECMIS.Model.CaseStore.update(kase.id, rest);
        (async () => {
          await ECMIS.updateCaseStatus(kase, nextStatus, sb);
          ECMIS.toastOk(complex ? `ส่งสำนวน ${kase.id} เข้าคณะอนุกลั่นกรองฯ เรียบร้อย` : `บันทึกความเห็นเสนอสำนวน ${kase.id} และส่งประธานฯ ลงนามมอบหมายเรียบร้อย`);
          renderKPI(); render(); updateQueueCounts();
        })();
      });
    }

    $(document).ready(function () {
      renderKPI(); render(); updateQueueCounts();
      $('#queueSwitcher .btn').on('click', function () {
        queueMode = $(this).data('queue');
        kpiFilter = 'WAIT';
        currentPage = 1;
        updateQueueCounts(); renderKPI(); render();
      });
      $('#searchInput').on('input', function () { currentPage = 1; render(); });
      $('#typeFilter').on('change', function () { currentPage = 1; render(); });
      $('#btnClearFilter').on('click', function () {
        $('#searchInput').val(''); $('#typeFilter').val('ALL'); kpiFilter = 'WAIT'; currentPage = 1;
        renderKPI(); render();
      });
      $('.sortable-header').on('click', function () {
        const f = $(this).data('sort');
        if (sortField === f) sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
        else { sortField = f; sortOrder = 'asc'; }
        $('.sortable-header i').attr('class', 'fa-solid fa-sort ms-1');
        $(this).find('i').attr('class', `fa-solid fa-sort-${sortOrder === 'asc' ? 'up' : 'down'} ms-1`);
        currentPage = 1; render();
      });

      (async function refreshFromSupabase() {
        const live = await loadCasesFromSupabase();
        if (live && live.length) {
          CASES = live;
          currentPage = 1;
          renderKPI(); render(); updateQueueCounts();
        }
      })();
    });
  </script>
</body>

</html>
