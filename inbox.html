/* ---------- โหลดสำนวนจาก Supabase จริง (tbl_res_request → tbl_cmp_case → tbl_cmp_case_accused)
   แทน ECMIS.CASES แบบ mock — คงรูปร่าง object ให้เหมือนเดิมทุกฟิลด์ที่หน้านี้ใช้ เพื่อไม่ต้อง
   แก้ตรรกะ render/filter/KPI ด้านล่าง ยังไม่ครอบคลุมทุกฟิลด์ของ CASES เดิม (เช่น chainOpinions,
   resolution, meetingNo, m28 รายละเอียด) เพราะหน้านี้ไม่ได้ใช้ — หน้าอื่นที่ต้องใช้ฟิลด์เหล่านั้น
   (approval-review.html ฯลฯ) ยังอ่านจาก ECMIS.CASES เดิมอยู่ จนกว่าจะย้ายเป็นรอบถัดไป */
const SUPABASE_URL = 'https://ljhabbwjxnoucrcrsoii.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2Bps-dWMZHz_7cs3BppF6A_ul1_A_xd';
const sb = (window.ECMIS && window.ECMIS.getSupabaseClient) ? window.ECMIS.getSupabaseClient(SUPABASE_URL, SUPABASE_KEY) : (window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } }) : null);

function toBuddhistFakeIso(realIso) {
  if (!realIso) return null;
  const [y, m, d] = String(realIso).split('-');
  return `${parseInt(y, 10) + 543}-${m}-${d}`;
}

async function loadCasesFromSupabase() {
  const { data, error } = await sb
    .from('tbl_res_request')
    .select('*, tbl_cmp_case(*, tbl_cmp_case_accused(*))')
    .eq('is_deleted', false);
  if (error) throw error;

  return data
    .filter(row => row.tbl_cmp_case)
    .map(row => {
      const cc = row.tbl_cmp_case;
      return {
        trr_id: row.trr_id, tcc_id: cc.tcc_id,
        id: cc.tcc_no, subject: cc.tcc_subject, allegation: cc.tcc_allegation,
        legalBase: cc.tcc_legal_base, complainant: cc.tcc_complainant,
        owner: cc.tcc_owner, ownerOrg: cc.tcc_owner_org,
        receivedDate: toBuddhistFakeIso(cc.tcc_received_date),
        prescription: toBuddhistFakeIso(cc.tcc_prescription_date),
        docRef: cc.tcc_doc_ref, docType: cc.tcc_doc_type,
        complex: !!cc.tcc_complex,
        accused: (cc.tbl_cmp_case_accused || [])
          .filter(a => !a.is_deleted)
          .sort((a, b) => (a.tcca_no || 0) - (b.tcca_no || 0))
          .map(a => ({ no: a.tcca_no, name: a.tcca_name, pos: a.tcca_position, idcard: a.tcca_idcard, agency: a.tcca_agency })),
        status: ECMIS.CODE_STATUS[row.trr_status] || row.trr_status,
        slaDays: row.trr_sla_days, slaLimit: row.trr_sla_limit,
        urgent: !!row.trr_urgent, urgent72: !!row.trr_urgent,
        signedBySecgen: !!row.trr_signed_secgen, subCommittee: row.trr_sub_committee
      };
      if (row.trr_resolution_data) Object.assign(kase, row.trr_resolution_data);
      kase.status = ECMIS.CODE_STATUS[row.trr_status] || row.trr_status;
      return kase;
    });
}

/* PENDING_URGENT เป็นคิวของ ผอ.กบค. (dir_case) เสมอ ไม่ใช่ของประธานฯ — ต้องรอ dir_case
   รับรอง (event URGENT_CERTIFY) ให้สถานะเปลี่ยนเป็น PENDING_CHAIRMAN ก่อนจึงจะถึงคิวประธานฯ จริง
   (เดิมมีเงื่อนไข `c.status === 'PENDING_URGENT' && c.urgent` ปนอยู่ ทำให้ปุ่ม "พิจารณาสั่งการ"
   ขึ้นก่อนเวลาสำหรับสำนวนด่วนที่ยังไม่ผ่าน ผอ.กบค. รับรอง กดเข้าไปแล้วหน้า chairman-agenda.html
   ล็อกไม่มีปุ่มลงนามให้ — ตัดออกให้ตรงกับ state machine จริง) */
function isChairActionable(c) {
  return c.status === 'PENDING_CHAIRMAN' ||
         c.status === 'PENDING_CHAIRMAN_72' ||
         c.status === 'PENDING_CHAIRMAN_URGENT_72' ||
         c.status === 'PENDING_SIGN_AGENDA_72' ||
         c.status === 'PENDING_SIGN_RULING_72' ||
         c.status === 'PENDING_SIGN_ORDER_CHAIRMAN';
}

/* รายการสถานะงานที่ต้องจัดทำของเจ้าหน้าที่กลุ่มงานกิจการคณะกรรมการ (affairs) — เดิมมี 'DEFERRED'
   อยู่ในนี้ (เลื่อน/ถอนวาระ รอเลขวาระใหม่) แต่การจัดวาระใหม่เป็นงานของกลุ่มมติ (board_sec) ผ่านคิว
   "รอบรรจุวาระ" ใน agenda-registry.html อยู่แล้ว (bucket "กลับมาอีก") จึงตัดออกจากที่นี่ — และเดิม
   ไม่มี 'RESOLVED' อยู่เลยทั้งที่ comment ใน mine (ด้านล่าง) บอกว่า affairs ต้องเห็นเคส RESOLVED
   เพื่อจัดทำคำสั่ง ม.24 ต่อ (เป็น dead code มาตลอด — ไม่มีสำนวนไหนขึ้นคิวนี้จริงเลย) เพิ่มกลับเข้ามา */
const AFFAIRS_STATUSES = ['RESOLVED', 'RESOLVED_PENDING_72', 'PENDING_DISPATCH_GUILTY_72'];
/* RESOLVED ใช้ร่วมกันทั้งสาย 7.1 (ต้องจัดทำคำสั่ง ม.24 ต่อ) และสาย 7.3 (เรื่องของ กกม./ทั่วไป ซึ่ง
   ไม่มีคำสั่ง ม.24 — จบที่แจ้งมติ/ปิดเรื่องแทน ดู FLOW_STEPS_73 ใน ecmis-app.js) — งานแจ้งมติของ
   สาย 7.3 ยังไม่ได้ออกแบบหน้าจอ/สถานะเฉพาะ จึงยังไม่ดึงเข้าคิวนี้ ป้องกันป้ายผิดว่า "รอจัดทำคำสั่ง"
   ทั้งที่ไม่มีคำสั่งต้องออก (ดู getAffairsActionBadge()) */
function isAffairsQueueCase(c) {
  if (!AFFAIRS_STATUSES.includes(c.status)) return false;
  if (c.status === 'RESOLVED' && ECMIS.isCase73(c)) return false;
  /* กันเคสข้อมูลผิดสาย (พบจริงกับ 1119/2565 — เคส 7.2 ที่ดันตั้ง status เป็น 'RESOLVED' ของสาย
     หลักแทน 'RESOLVED_PENDING_72') ไม่ให้หลุดเข้าคิว "รอจัดทำคำสั่ง" ของสาย 7.1 — ถ้าเป็นเคส 7.2
     จริง สถานะที่ถูกต้องคือ RESOLVED_PENDING_72 อยู่แล้ว ไม่ควรมาเจอ 'RESOLVED' เฉยๆ ที่นี่เลย */
  if (c.status === 'RESOLVED' && ECMIS.isCase72(c)) return false;
  return true;
}

let CASES, all, mine;

function inboxFor(roleId) {
  return CASES.filter(c => ECMIS.STATUS[c.status] && ECMIS.STATUS[c.status].owner === roleId);
}

/* สถานะที่ยังไม่ถึงชั้นเลขาธิการฯ เลย (ยังอยู่กับสายงานต้นทาง กจ.5) — ใช้เช็คทั้งสายรายงาน 213
   และสายรายงานวินิจฉัยชี้มูล (_72) เนื่องจาก ECMIS.STATUS ใส่ scope:'UPSTREAM' ไว้เฉพาะสายหลัก */
const UPSTREAM_STATUSES = [
  'DRAFT', 'PENDING_SECTION', 'PENDING_DIRECTOR', 'PENDING_DEPUTY',
  'PENDING_SECTION_72', 'PENDING_DIRECTOR_72', 'PENDING_DEPUTY_72'
];

function getSecgenStatusCategory(c) {
  if (c.status === 'IN_SCREENING' || c.status === 'IN_SCREENING_72') {
    return 'SCREENING';
  }
  if (c.status === 'RETURNED' || c.status === 'RETURNED_72' ||
      (c.m28 && (c.m28.orderType === 'REJECT' || c.m28 === 'REJECT' || c.m28 === 'DISMISS'))) {
    return 'RETURNED';
  }
  if (c.status === 'PENDING_SECGEN' || c.status === 'PENDING_SECGEN_72') {
    return 'PENDING';
  }
  /* เคสคำสั่ง ม.24 ที่ affairs ส่งมาให้เลขาธิการฯ ลงนาม (order.html) — ต้องนับเป็น 'PENDING' ด้วย
     ไม่งั้นจะตกไปเข้าเงื่อนไข fallback 'SIGNED' ด้านล่าง (แปลว่า "ผ่านชั้นเลขาธิการฯ ไปแล้ว")
     ทั้งที่นี่คือของที่รอเลขาธิการฯ ทำเองอยู่ — isMyPending()/applyFilters() เช็คคำว่า 'PENDING'
     ตรงๆ จึงต้องคืนค่านี้ ไม่ใช่ category ใหม่ (getSecgenActionBadge() แยกข้อความป้ายเองอีกที) */
  if (c.status === 'PENDING_SIGN_ORDER_SECGEN') {
    return 'PENDING';
  }
  if (UPSTREAM_STATUSES.includes(c.status)) {
    return 'UPSTREAM';
  }
  /* ทุกสถานะอื่นแปลว่าผ่านชั้นเลขาธิการฯ ไปแล้ว (ไม่ว่าจะรอประธานฯ/อนุกลั่นกรอง/บอร์ด/ปิดสำนวน) */
  return 'SIGNED';
}

let mineIds = new Set();
function isMyPending(c){
  if (role.id === 'chairman') return isChairActionable(c);
  if (role.id === 'secgen' || role.id === 'support_sub') {
    return getSecgenStatusCategory(c) === 'PENDING';
  }
  return mineIds.has(c.id);
}

let allCasesCombined = [];
function buildAllCasesCombined() {
  const map = new Map();
  mine.forEach(c => map.set(c.id, { caseData: c, isActionable: true }));
  all.forEach(c => {
    if (!map.has(c.id)) map.set(c.id, { caseData: c, isActionable: false });
  });
  allCasesCombined = Array.from(map.values()).map(item => {
    const c = item.caseData;
    return { ...c, isActionable: item.isActionable || isMyPending(c) };
  });
}

function caseIdSortValue(id) {
  const m = /^(\d+)\/(\d+)$/.exec(id || '');
  if (!m) return 0;
  return parseInt(m[2], 10) * 100000 + parseInt(m[1], 10);
}

function getSecgenActionBadge(c) {
  const cat = getSecgenStatusCategory(c);
  if (cat === 'SCREENING') {
    return `<span class="meet-badge meet-review"><i class="fa-solid fa-users-gear me-1"></i>ส่งให้อนุกลั่นกรองพิจารณา</span>`;
  }
  if (cat === 'RETURNED') {
    return `<span class="meet-badge meet-returned"><i class="fa-solid fa-xmark me-1"></i>ไม่ลงนาม / ตีกลับ</span>`;
  }
  if (cat === 'SIGNED') {
    return `<span class="meet-badge meet-done"><i class="fa-solid fa-check me-1"></i>ลงนามแล้ว</span>`;
  }
  /* UPSTREAM: ยังไม่ถึงชั้นเลขาธิการฯ — แสดงสถานะจริงตามสายงานต้นทาง ไม่ใช่ป้าย "รอเลขาฯ" ที่ทำให้เข้าใจผิด */
  if (cat === 'UPSTREAM') {
    return ECMIS.statusBadge(c.status);
  }
  /* คำสั่ง ม.24 ที่ affairs ส่งมาให้ลงนาม (คนละงานกับ "พิจารณารายงาน 213" ปกติของเลขาธิการฯ) —
     แยกป้ายให้ชัดว่าต้องลงนามคำสั่งอะไร ไม่ใช้คำกลาง "รอเลขาพิจารณาลงนาม" ที่จะสับสนกับงานปกติ */
  if (c.status === 'PENDING_SIGN_ORDER_SECGEN') {
    return `<span class="meet-badge meet-affairs-ruling"><i class="fa-solid fa-file-signature me-1"></i>รอลงนามคำสั่ง ม.24</span>`;
  }
  /* สำนวนที่ผ่านการกลั่นกรองจากคณะอนุกรรมการสนับสนุนเลขาธิการฯ ส่งกลับมา */
  if ((c.status === 'PENDING_SECGEN' || c.status === 'PENDING_SECGEN_72') && (c.supportOpinion || c.supportOpinion72 || c.supportDecision)) {
    return `<span class="meet-badge" style="background:#e0f2fe;color:#0369a1;border:1px solid #7dd3fc;font-weight:600"><i class="fa-solid fa-clipboard-check me-1"></i>ผ่านอนุสนับสนุนฯ แล้ว — รอลงนาม</span>`;
  }
  return `<span class="meet-badge meet-pending"><i class="fa-solid fa-circle-dot me-1" style="font-size:0.65rem"></i>รอเลขาพิจารณาลงนาม</span>`;
}

   ทำตามรูปแบบเดียวกับ getSecgenActionBadge()/chairman catBadge — ป้ายเฉพาะของ affairs 3 แบบ
   ตรงกับงาน 3 อย่างที่กลุ่มกิจการฯ ต้องทำต่อจริง ๆ */

    return `<span class="meet-badge meet-pending"><i class="fa-solid fa-file-signature me-1"></i>รอจัดทำคำสั่ง</span>`;

    return `<span class="meet-badge meet-review"><i class="fa-solid fa-paper-plane me-1"></i>รอส่งดำเนินคดี</span>`;

  return ECMIS.statusBadge(c.status);

    else if (c.status === 'PENDING_SIGN_RULING_72') catBadge = `<span class="meet-badge meet-affairs-ruling"><i class="fa-solid fa-file-signature me-1"></i>รอลงนามรายงานชี้มูล</span>`;
    else if (c.status === 'PENDING_SIGN_ORDER_CHAIRMAN') catBadge = `<span class="meet-badge meet-affairs-ruling"><i class="fa-solid fa-file-signature me-1"></i>รอลงนามคำสั่ง ม.24</span>`;
    else catBadge = `<span class="meet-badge meet-pending"><i class="fa-solid fa-hourglass-half me-1"></i>รอสั่งการวาระปกติ</span>`;

    /* กำหนดหน้าเป้าหมายสำหรับประธานฯ ให้ตรงกับงานแต่ละประเภท:
       - PENDING_SIGN_ORDER_CHAIRMAN -> order.html (จัดทำ/ลงนามคำสั่ง ม.24)
       - PENDING_SIGN_RULING_72 -> ruling-report.html (รายงานวินิจฉัยชี้มูล 7.2)
       - PENDING_CHAIRMAN_URGENT_72 -> urgent-agenda.html (บรรจุวาระด่วน 7.2)
       - PENDING_CHAIRMAN / PENDING_URGENT -> chairman-agenda.html (สั่งการและบรรจุวาระปกติ) */
    let chairTarget;
    if (c.status === 'PENDING_SIGN_ORDER_CHAIRMAN') {
      chairTarget = `order.html?case=${encodeURIComponent(c.id)}`;
    } else if (c.status === 'PENDING_SIGN_RULING_72') {
      chairTarget = `ruling-report.html?case=${encodeURIComponent(c.id)}`;
    } else if (c.status === 'PENDING_CHAIRMAN_URGENT_72') {
      chairTarget = `urgent-agenda.html?case=${encodeURIComponent(c.id)}`;
    } else {
      /* PENDING_CHAIRMAN (7.1) / PENDING_CHAIRMAN_72 (ลงนามมอบหมายส่งกลั่นกรอง)
         / PENDING_SIGN_AGENDA_72 (ลงนามสั่งบรรจุวาระ หลังกลั่นกรอง) — ทั้งหมดใช้ chairman-agenda.html */
      chairTarget = `chairman-agenda.html?case=${encodeURIComponent(c.id)}`;
    }

    const typeTag = typeBadge(c, is72);

    return `<tr>
      <td class="case-no">${c.id}${(c.urgent || c.urgent72)?' <span class="st st-urgent ms-1">ด่วน</span>':''}</td>
      <td>${typeTag}</td>
      <td style="max-width:300px">
        <div class="text-truncate fw-medium" title="${c.subject}">${c.subject}</div>
        <small class="text-muted d-block" style="font-size:0.75rem">${c.ownerOrg}</small>
      </td>
      <td>${catBadge}</td>
      <td>${ECMIS.slaBadge(c)}</td>
      <td class="text-end">
        ${isActionable ? `
          <a href="${chairTarget}" class="btn btn-sm btn-gold px-3 shadow-sm" style="background:#D0A830; border-color:#B89224; color:#0F2A62; font-weight:600">
            <i class="fa-solid fa-signature me-1"></i>พิจารณาสั่งการ
          </a>
        ` : `
          <a href="${target}" class="btn btn-sm btn-outline-secondary px-3">
            <i class="fa-solid fa-eye me-1"></i>ดูรายละเอียด
          </a>
        `}
      </td>
    </tr>`;
  }

  const isPendingAction = isMyPending(c);
  const statusBadgeHtml = getActionBadge(c);
  const typeTag = typeBadge(c, is72);

  return `<tr>
    <td class="case-no">${c.id}${(c.urgent || c.urgent72)?' <span class="st st-urgent ms-1">ด่วน</span>':''}</td>
    <td>${typeTag}</td>
    <td style="max-width:300px">
      <div class="text-truncate fw-medium" title="${c.subject}">${c.subject}</div>
      <small class="text-muted d-block" style="font-size:0.75rem">${c.ownerOrg}</small>
    </td>
    <td>${statusBadgeHtml}</td>
    <td>${ECMIS.slaBadge(c)}</td>
    <td class="text-end">
      ${isPendingAction ? `
        <a href="${target}" class="btn btn-sm btn-navy px-3">
          <i class="fa-solid fa-pen-to-square me-1"></i>ดำเนินการ
        </a>
      ` : `
        <a href="${target}" class="btn btn-sm btn-outline-secondary px-3">
          <i class="fa-solid fa-eye me-1"></i>ดูรายละเอียด
        </a>
      `}
    </td>
  </tr>`;
}

let filteredCombined = [];

function renderMyQueue(loading = false) {
  const tbodyPrimary = document.getElementById('myQueue');

  if (loading) {
    let skeletons = '';
    for(let i=0; i<Math.min(pageSize, filteredCombined.length || 3); i++) {
      skeletons += `
        <tr class="skeleton-row">
          <td><div class="skeleton-box" style="width:80px"></div></td>
          <td><div class="skeleton-box" style="width:90px"></div></td>
          <td><div class="skeleton-box" style="width:200px"></div></td>
          <td><div class="skeleton-box" style="width:110px"></div></td>
          <td><div class="skeleton-box" style="width:80px"></div></td>
          <td class="text-end"><div class="skeleton-box ms-auto" style="width:80px"></div></td>
        </tr>`;
    }
    tbodyPrimary.innerHTML = skeletons;

    setTimeout(() => {
      renderMyQueue(false);
    }, 250);
    return;
  }

  const sortedCases = [...filteredCombined].sort((a, b) => {
    const isPendingA = isMyPending(a) ? 1 : 0;
    const isPendingB = isMyPending(b) ? 1 : 0;

    if (isPendingA !== isPendingB) {
      return isPendingB - isPendingA;
    }

    let valA = a[sortField];
    let valB = b[sortField];
    if (sortField === 'id') {
      valA = caseIdSortValue(a.id);
      valB = caseIdSortValue(b.id);
    } else if (sortField === 'slaDays') {
      valA = a.slaDays;
      valB = b.slaDays;
    }
    if (valA < valB) return sortOrder === 'asc' ? -1 : 1;
    if (valA > valB) return sortOrder === 'asc' ? 1 : -1;
    return 0;
  });

  const totalItems = sortedCases.length;
  const totalPages = Math.ceil(totalItems / pageSize) || 1;
  if (currentPage > totalPages) currentPage = totalPages;
  const startIdx = (currentPage - 1) * pageSize;
  const paginatedCases = sortedCases.slice(startIdx, startIdx + pageSize);

  tbodyPrimary.innerHTML = paginatedCases.length
    ? paginatedCases.map(c => row(c)).join('')
    : `<tr><td colspan="6" class="text-center text-muted py-4">
         <i class="fa-solid fa-face-smile fa-lg mb-2 d-block"></i>
         ไม่มีรายการสำนวนตามเงื่อนไขการค้นหา<br>
         <small>ลองเปลี่ยนข้อความค้นหาหรือตัวกรองสถานะ</small></td></tr>`;


  const paginUl = document.getElementById('queuePagination');
  let paginHtml = `
    <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
      <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">«</a>
    </li>`;
  for (let i = 1; i <= totalPages; i++) {
    paginHtml += `
      <li class="page-item ${currentPage === i ? 'active' : ''}">
        <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
      </li>`;
  }
  paginHtml += `
    <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
      <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">»</a>
    </li>`;
  paginUl.innerHTML = paginHtml;
}

function changePage(p) {
  currentPage = p;
  renderMyQueue(true);
}

document.querySelectorAll('.sortable-header').forEach(header => {
  header.addEventListener('click', () => {
    const field = header.dataset.sort;
    if (sortField === field) {
      sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
    } else {
      sortField = field;
      sortOrder = 'asc';
    }

    document.querySelectorAll('.sortable-header i').forEach(icon => {
      icon.className = 'fa-solid fa-sort text-muted';
    });
    const activeIcon = header.querySelector('i');
    if (activeIcon) activeIcon.className = `fa-solid fa-sort-${sortOrder === 'asc' ? 'up' : 'down'}`;

    renderMyQueue(true);
  });
});

function applyFilters() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const st = document.getElementById('statusFilter').value;
  const docTypeVal = document.getElementById('docTypeFilter')?.value || 'ALL';

  filteredCombined = allCasesCombined.filter(c => {
    const matchQ = !q ||
      c.id.toLowerCase().includes(q) ||
      (c.subject && c.subject.toLowerCase().includes(q)) ||
      (c.ownerOrg && c.ownerOrg.toLowerCase().includes(q)) ||
      (c.owner && c.owner.toLowerCase().includes(q)) ||
      (c.complainant && c.complainant.toLowerCase().includes(q)) ||
      (Array.isArray(c.accused) && c.accused.some(p =>
        (p.name && p.name.toLowerCase().includes(q)) ||
        (p.idcard && p.idcard.toLowerCase().includes(q))
      ));

    let matchDocType = true;
    if (docTypeVal === '71') matchDocType = (!ECMIS.isCase72(c) && !ECMIS.isCase73(c));
    else if (docTypeVal === '72') matchDocType = ECMIS.isCase72(c);
    else if (docTypeVal === '73') matchDocType = ECMIS.isCase73(c);

    let matchSt = true;
    if (role.id === 'chairman') {
      if (st !== 'ALL') {
        if (st === 'PENDING_NORMAL') matchSt = ((c.status === 'PENDING_CHAIRMAN' && !c.urgent) || c.status === 'PENDING_CHAIRMAN_72');
        else if (st === 'PENDING_URGENT') matchSt = (c.status === 'PENDING_CHAIRMAN_URGENT_72' || (c.status === 'PENDING_CHAIRMAN' && c.urgent));
        else if (st === 'PENDING_SIGN_AGENDA') matchSt = (c.status === 'PENDING_SIGN_AGENDA_72');
        else if (st === 'PENDING_RULING') matchSt = (c.status === 'PENDING_SIGN_RULING_72');
        else if (st === 'PENDING_ORDER') matchSt = (c.status === 'PENDING_SIGN_ORDER_CHAIRMAN');
      }
    } else if (role.id === 'affairs') {
      if (st !== 'ALL') matchSt = (c.status === st);
    } else if (st !== 'ALL') {
      if (st === 'MINE_PENDING') {
        matchSt = (getSecgenStatusCategory(c) === 'PENDING');
      } else {
        matchSt = (getSecgenStatusCategory(c) === st);
      }
    }

    return matchQ && matchDocType && matchSt;
  });

  currentPage = 1;
  renderKPICards();
  renderMyQueue(true);
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('docTypeFilter')?.addEventListener('change', applyFilters);
document.getElementById('statusFilter').addEventListener('change', applyFilters);
document.getElementById('btnClearFilter').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  const dtEl = document.getElementById('docTypeFilter');
  if (dtEl) dtEl.value = 'ALL';
  document.getElementById('statusFilter').value = 'ALL';
  applyFilters();
});

(async function main() {
  try {
    const live = await loadCasesFromSupabase();
    CASES = (live && live.length) ? live : ECMIS.CASES.slice();
    if (live && live.length && typeof ECMIS.cacheLiveCases === 'function') {
      ECMIS.cacheLiveCases(live);
    }
  } catch (err) {
    console.error('โหลดข้อมูลจากฐานข้อมูลไม่สำเร็จ:', err);
    CASES = ECMIS.CASES.slice();
  }
  /* เลขาธิการฯ: "ทั้งหมด" ควรมีเฉพาะสำนวนที่คลิก "ดำเนินการ" แล้วเข้าหน้า approval-review.html
     จริง (หน้าที่เลขาธิการฯ มี process จริงๆ) — สำนวนสาย 213/644 ไปหน้านี้เสมอไม่ว่าสถานะใด
     ส่วนสายรายงานวินิจฉัยชี้มูล (_72) ไปหน้านี้เฉพาะช่วงก่อนถึง/รอเลขาธิการฯ ลงนามเท่านั้น
     (พ้นจากนั้นไปหน้าเฉพาะทาง เช่น 72-08/72-09) จึงตัดออกจากมุมมองนี้เช่นกัน */
  function routesToApprovalReview(c) {
    return ECMIS.isCase72(c)
      ? ECMIS.pageForCase72(c) === 'approval-review.html'
      : (PAGE_FOR['secgen'] === 'approval-review.html');
  }
  /* ประธานฯ: "ทั้งหมด" เหลือเฉพาะสำนวนที่ประธานฯ ต้องดำเนินการ (isChairActionable) เท่านั้น —
     ตัดมุมมองแบบเห็นทุกสำนวนในระบบ (view.all) ออก เพราะไม่ใช่ process ของประธานฯ โดยตรง
     เหมือนหลักการเดียวกับ secgen ด้านล่าง */
  all = role.id === 'affairs'
    ? CASES.filter(c => isAffairsQueueCase(c) && ECMIS.canViewCase(c, role.id))
    : role.id === 'secgen'
      ? CASES.filter(c => ECMIS.canViewCase(c, role.id) && routesToApprovalReview(c) && !UPSTREAM_STATUSES.includes(c.status))
      : role.id === 'chairman'
        ? CASES.filter(c => isChairActionable(c) && ECMIS.canViewCase(c, role.id))
        : CASES.filter(c => ECMIS.canViewCase(c, role.id));
  mine = role.id === 'chairman'
    ? CASES.filter(c => isChairActionable(c))
    /* affairs ใช้ AFFAIRS_STATUSES เดียวกับ `all` ด้านบนเสมอ — ไม่ใช้ inboxFor() ตรงๆ เพราะ
       inboxFor() อิง STATUS[status].owner ตัวเดียว (RESOLVED เป็นของ board_sec) แต่ affairs
       ก็ต้องเห็นสำนวน RESOLVED เป็นงานของตัวเองด้วยเพื่อพิจารณาจัดทำคำสั่ง ม.24 ต่อ */
    : role.id === 'affairs'
      ? CASES.filter(c => isAffairsQueueCase(c) && !ECMIS.isUpstreamCase(c) && ECMIS.canViewCase(c, role.id))
      : inboxFor(role.id).filter(c => !ECMIS.isUpstreamCase(c) && ECMIS.canViewCase(c, role.id));
  mineIds = new Set(mine.map(c => c.id));
  buildAllCasesCombined();
  filteredCombined = [...allCasesCombined];

  /* เลขบนแถบเมนูด้านข้าง (badge สีแดง) มาจาก ECMIS.inboxFor() ซึ่งอิง CASES จำลองส่วนกลาง
     ไม่ใช่ข้อมูลจริงจาก Supabase ที่โหลดในหน้านี้ — sync ให้ตรงกับจำนวนที่ต้องดำเนินการจริง (mine) */
  const navBadge = document.querySelector('#appSidebar .badge.bg-danger.rounded-pill');
  if (navBadge) {
    if (mine.length) navBadge.textContent = mine.length;
    else navBadge.remove();
  }

  renderKPICards();
  applyFilters();
})();

</script>
