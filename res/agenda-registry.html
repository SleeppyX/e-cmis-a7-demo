<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ทะเบียนวาระการประชุม | E-CMIS</title>
  <link rel="icon" type="image/png" href="../assets/pacc_logo.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="../assets/ecmis-app.css" rel="stylesheet">
  <style>
    .meet-row{cursor:pointer}
    #meetTb tr:hover{background:var(--table-row-hover)}
    .meet-row-actions{display:inline-flex;align-items:center;gap:.6rem}
    .btn-delete-meet{border:0;background:none;color:#a5322a;padding:0;cursor:pointer;line-height:1;font-size:.9rem}
    .btn-delete-meet:hover{color:#7a241f}
    .swal2-popup .form-label{font-size:.82rem;font-weight:600;margin-bottom:.25rem;display:block;text-align:left}
  </style>
</head>

<body>

  <main class="app-main">
    <div class="page-head">
      <div>
        <h1><i class="fa-solid fa-calendar-days me-2"></i>ทะเบียนวาระการประชุม</h1>
      </div>
      <div class="d-flex align-items-center gap-2 ms-auto">
        <a href="agenda-detail.html?meet=ALL" class="btn btn-sm btn-outline-navy fw-semibold">
          <i class="fa-solid fa-table-list me-1"></i>ดูทะเบียนคุมวาระรวมทุกครั้ง
        </a>
        <button class="btn btn-sm btn-navy" id="btnAddMeeting">
          <i class="fa-solid fa-plus me-1"></i>เพิ่มการประชุม
        </button>
      </div>
    </div>

    <!-- Section 1: Queue of cases waiting for agenda -->
    <div class="card card-ecmis mb-4">
      <div class="card-body p-3 pb-2">
        <label class="form-label fw-semibold text-dark small mb-2"><i class="fa-solid fa-layer-group me-1 text-muted"></i>คิวรอบรรจุวาระ — จัดหมวดตามลักษณะงาน</label>
        <div class="d-flex flex-wrap gap-2" id="categoryChips"></div>
        <div class="table-responsive mt-2 d-none" id="queueTableWrap">
          <table class="table table-hover tbl-ecmis mb-0" style="font-size:.85rem">
            <thead>
              <tr>
                <th>เรื่องที่</th>
                <th>เรื่องกล่าวหา</th>
                <th>สถานะ</th>
                <th class="text-end">ดำเนินการ</th>
              </tr>
            </thead>
            <tbody id="queueTb"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Section 2: Meetings list -->
    <div class="card card-ecmis">
      <div class="card-header d-flex align-items-center">
        <i class="fa-solid fa-calendar-check me-2 text-primary"></i> 
        <span class="fw-bold">ครั้งที่ประชุม</span>
        <span class="badge bg-secondary rounded-pill ms-2" id="meetCnt">0</span>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover tbl-ecmis mb-0" id="meetingList">
            <thead>
              <tr>
                <th class="meet-sortable" data-sort-key="name" style="cursor:pointer;user-select:none">ครั้งที่ประชุม <i class="fa-solid fa-sort ms-1 sort-icon"></i></th>
                <th class="meet-sortable" data-sort-key="date" style="cursor:pointer;user-select:none">วันที่ <i class="fa-solid fa-sort ms-1 sort-icon"></i></th>
                <th class="meet-sortable text-center" data-sort-key="count" style="cursor:pointer;user-select:none">จำนวนวาระ <i class="fa-solid fa-sort ms-1 sort-icon"></i></th>
                <th class="meet-sortable" data-sort-key="status" style="cursor:pointer;user-select:none">สถานะ <i class="fa-solid fa-sort ms-1 sort-icon"></i></th>
                <th style="width:170px"></th>
              </tr>
            </thead>
            <tbody id="meetTb"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../assets/ecmis-app.js"></script>
  <script src="../assets/agenda-registry-data.js"></script>
  <script>
    ECMIS.renderShell('agenda-registry.html');
    const M = ECMIS.mergeField;
    const AR = AgendaRegistry;
    const role = ECMIS.currentRole();
    const mayEdit = ECMIS.can('create.agenda', role.id);

    if (!mayEdit) {
      document.getElementById('btnAddMeeting').disabled = true;
    }

    /* คิวรอบรรจุวาระ — เดิมอยู่ที่ resolution-index.html แต่ concept นี้ (สำนวนที่รอถูกจัดวาระ
       ยังไม่ใช่รายการมติที่บันทึกแล้ว) เข้ากับหน้าทะเบียนวาระนี้มากกว่า จึงย้ายมาไว้ที่นี่ — สถานะที่ใช้
       จัดหมวดอ้างจาก STATUS map จริง (ecmis-app.js): AGENDA_SET/PENDING_INVITE_72 = รอดำเนินการที่
       agenda.html, DEFERRED = เคยตีกลับ/เลื่อนวาระ รอเลขวาระใหม่ (จึงจัดเป็น "กลับมาอีก" ไม่ใช่
       เรื่องใหม่) — เดิมโค้ดนี้ยังอ้างอิง 'RETURNED' (สถานะต้นทาง ส่งคืน กจ.5 ก่อนถึงชั้นเลขาธิการฯ
       ด้วยซ้ำ ไม่เกี่ยวกับการบรรจุวาระเลย) และ 'MORE_INFO'/'ROUND_REWORK' (ไม่มีอยู่จริงใน
       STATUS_CODE เลยสักคำ) ทำให้คิวนี้แสดงสำนวนที่ยังไม่พร้อมบรรจุวาระปนอยู่ — ตัดออกทั้งหมด */
    /* ใช้ AR.sb (client เดียวกับที่ agenda-registry-data.js สร้างไว้แล้ว) แทนการสร้าง client
       ใหม่ซ้ำ — กันคำเตือน "Multiple GoTrueClient instances" เมื่อหน้าเดียวกันมีหลาย client */
    const QUEUE_BUCKET = {
      pending: ['AGENDA_SET', 'PENDING_INVITE_72'],
      return:  ['DEFERRED']
    };
    let queueCases = [];
    let categoryFilterVal = 'ALL';

    async function loadQueueCasesFromSupabase() {
      try {
        const wantedCodes = [...QUEUE_BUCKET.pending, ...QUEUE_BUCKET.return]
          .map(k => ECMIS.STATUS_CODE[k]).filter(Boolean);
        const { data, error } = await AR.sb
          .from('tbl_res_request')
          .select('*, tbl_cmp_case!inner(*, tbl_cmp_case_accused(*))')
          .in('trr_status', wantedCodes)
          .eq('is_deleted', false);
        if (error) throw error;
        const mapped = (data || []).map(ECMIS.supabaseRowToCase).filter(Boolean)
          .filter(c => ECMIS.canViewCase(c, role.id))
          .filter(c => !AR.LINKED_TRR_IDS.has(c.trr_id));
        return mapped;
      } catch (err) {
        console.warn('โหลดคิวจาก Supabase ไม่สำเร็จ ใช้รายการสำนวนจำลอง:', err);
      }

      // Fallback จาก ECMIS.CASES เฉพาะตอน Supabase error จริงเท่านั้น — ผลลัพธ์ว่างเปล่าที่ถูกต้อง
      // (ไม่มีสำนวนไหนรอบรรจุวาระจริง) ต้องแสดงเป็นคิวว่าง ไม่ใช่สลับไปโชว์ข้อมูลจำลองที่สถานะไม่ตรงกัน
      return ECMIS.CASES.filter(c => {
        return ['AGENDA_SET', 'PENDING_INVITE_72', 'DEFERRED'].includes(c.status) || c.urgent || c.urgent72;
      }).map(c => Object.assign({}, c));
    }

    /* ข้อ 47 (ชีตติดตามงาน): เพิ่มหมวด "เรื่องที่ส่งมาจากคณะอนุกรรมการกลั่นกรอง" — ใช้ kase.subCommittee
       เป็นตัวบ่งชี้ (ผ่านการพิจารณาของคณะอนุกลั่นกรองคณะใดคณะหนึ่งมาแล้ว) ลำดับความสำคัญของป้ายเดียว
       ต่อ 1 เรื่อง: เร่งด่วนสำคัญที่สุด > จากอนุกลั่นกรอง > กลับมาอีก > เรื่องใหม่ */
    function getQueueCaseCategory(c) {
      if (c.urgent || c.urgent72) return 'URGENT';
      if (c.subCommittee) return 'SCREENING';
      if (QUEUE_BUCKET.return.includes(c.status)) return 'RETURN';
      return 'NEW';
    }

    function renderCategoryChips() {
      const counts = { URGENT: 0, SCREENING: 0, RETURN: 0, NEW: 0 };
      queueCases.forEach(c => { const cat = getQueueCaseCategory(c); if (counts[cat] !== undefined) counts[cat]++; });
      const chips = [
        { id: 'ALL', l: 'ทั้งหมด', i: 'fa-list', c: '#0F2A62', n: queueCases.length },
        { id: 'NEW', l: 'เรื่องใหม่', i: 'fa-file-circle-plus', c: '#0F2A62', n: counts.NEW },
        { id: 'SCREENING', l: 'จากอนุกรรมการกลั่นกรอง', i: 'fa-filter', c: '#0d9488', n: counts.SCREENING },
        { id: 'RETURN', l: 'กลับมาอีก (เลื่อน/ถอนวาระเดิม)', i: 'fa-arrows-rotate', c: '#6b3fa0', n: counts.RETURN },
        { id: 'URGENT', l: 'เรื่องเร่งด่วน', i: 'fa-bolt', c: '#DB2626', n: counts.URGENT }
      ];
      document.getElementById('categoryChips').innerHTML = chips.map(k => {
        const active = categoryFilterVal === k.id;
        return `<button type="button" class="btn btn-sm ${active ? '' : 'btn-outline-secondary'}"
            style="${active ? `background:${k.c};border-color:${k.c};color:#fff` : ''}"
            onclick="setCategoryFilter('${k.id}')">
          <i class="fa-solid ${k.i} me-1"></i>${k.l}
          <span class="badge ${active ? 'bg-light text-dark' : 'bg-secondary'} ms-1">${k.n}</span>
        </button>`;
      }).join('');
    }

    function renderQueueTable() {
      const wrap = document.getElementById('queueTableWrap');
      const tbody = document.getElementById('queueTb');
      const filtered = categoryFilterVal === 'ALL'
        ? queueCases
        : queueCases.filter(c => getQueueCaseCategory(c) === categoryFilterVal);
      if (!filtered.length) { wrap.classList.add('d-none'); tbody.innerHTML = ''; return; }
      wrap.classList.remove('d-none');
      tbody.innerHTML = filtered.map(c => {
        const cat = getQueueCaseCategory(c);
        const catBadge = cat === 'URGENT' ? '<span class="badge bg-danger ms-1">เร่งด่วน</span>'
          : cat === 'SCREENING' ? `<span class="badge text-white ms-1" style="background:#0d9488">จากอนุกลั่นกรอง ${ECMIS.escapeHtml(c.subCommittee)}</span>`
          : cat === 'RETURN' ? '<span class="badge bg-purple text-white ms-1" style="background:#6b3fa0">กลับมาอีก</span>'
          : '<span class="badge bg-primary ms-1">เรื่องใหม่</span>';

        const actionCell = mayEdit
          ? `<button type="button" class="btn btn-sm btn-navy px-3" onclick="openAgendaSetPopup('${encodeURIComponent(c.id)}')">
               <i class="fa-solid fa-pen-to-square me-1"></i>บรรจุวาระ
             </button>`
          : `<span class="badge bg-light text-muted border" title="สิทธิ์จัดทำระเบียบวาระ (create.agenda) จำกัดเฉพาะ ${ECMIS.getRole('board_sec').title}">
               <i class="fa-solid fa-lock me-1"></i>ดูอย่างเดียว
             </span>`;

        return `<tr>
          <td class="case-no">${c.id} ${catBadge}</td>
          <td class="text-truncate" style="max-width:320px">${c.subject}</td>
          <td>${ECMIS.statusBadge(c.status)}</td>
          <td class="text-end">${actionCell}</td>
        </tr>`;
      }).join('');
    }

    /* ---------- Popup บรรจุวาระ (สายหลักเท่านั้น — ดู comment ใน renderQueueTable) ----------
       ย้าย logic หลักมาจาก agenda.html (initAgenda71/handle('submit')) ให้เหมือนเดิมทุก
       ประการ ต่างแค่ตัดแผงพรีวิวเอกสารสด (auto-generate จาก case ไม่ได้แก้ไขที่ขั้นนี้อยู่แล้ว ดูซ้ำ
       ได้ที่ agenda-detail.html/meeting-docs.html ทีหลัง) ออก เพื่อให้ทำงานจบ
       ในคิวได้เลยโดยไม่ต้องออกจากหน้า */
    function meetingsOpenForPopup(urgent) {
      const list = AR.MEETINGS.filter(m => m.trc_status === '0').map(m => ({
        no: m.trc_name, date: m.trc_date, trc_id: m.trc_id,
        agendaCount: AR.itemsOf(m.trc_id).length,
        closesInDays: ECMIS.daysUntilFakeIso(m.trc_date)
      }));
      return urgent ? list : list.filter(m => m.closesInDays > 3);
    }
    const nextAgendaNoForPopup = m => `5.${m.agendaCount + 1}`;

    async function openAgendaSetPopup(encodedCaseId) {
      if (!mayEdit) { ECMIS.toastWarn('สิทธิ์จัดทำระเบียบวาระ (create.agenda) จำกัดเฉพาะ ' + ECMIS.getRole('board_sec').title); return; }
      const caseId = decodeURIComponent(encodedCaseId);
      const c = queueCases.find(x => x.id === caseId);
      if (!c) { ECMIS.toastWarn('ไม่พบสำนวนนี้ในคิว'); return; }
      const resolvedLike = ['RESOLVED_PENDING', 'RESOLVED', 'DISPATCHING', 'CLOSED'].includes(c.status) || c.docType === 'RULING' || ECMIS.isCase72(c);
      const isUrgent = !!(c.urgent || c.urgent72);

      const defaultTopic = `รายงานไต่สวน${resolvedLike ? 'เพื่อวินิจฉัยชี้มูล' : 'เบื้องต้น'} กรณี ${c.subject}`;

      const { value: form } = await Swal.fire({
        title: 'บรรจุระเบียบวาระ',
        width: 560,
        html: `
          <div class="text-start small mb-3 p-2 rounded" style="background:#F8FAFC;border:1px solid #E2E8F0">
            <strong>เรื่องที่ ${ECMIS.escapeHtml(c.id)}</strong><br>
            <span class="text-muted">${ECMIS.escapeHtml(c.subject)}</span>
          </div>
          <div class="text-start">
            <div class="btn-group mb-3 w-100" role="group">
              <input type="radio" class="btn-check" name="swAgendaMode" id="swModeExisting" value="EXISTING" checked>
              <label class="btn btn-outline-navy btn-sm" for="swModeExisting"><i class="fa-solid fa-calendar-plus me-1"></i>เข้าวาระที่มีอยู่แล้ว</label>
              <input type="radio" class="btn-check" name="swAgendaMode" id="swModeNew" value="NEW">
              <label class="btn btn-outline-navy btn-sm" for="swModeNew"><i class="fa-solid fa-calendar-days me-1"></i>ตั้งครั้งประชุมใหม่</label>
            </div>
            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" id="swUrgentToggle"${isUrgent ? ' checked' : ''}>
              <label class="form-check-label" for="swUrgentToggle"><span class="badge bg-danger">วาระเร่งด่วน</span> ข้ามการตรวจลำดับวาระปกติ</label>
            </div>
            <div id="swExistingBox" class="row g-2 mb-2">
              <div class="col-12"><label class="form-label">เลือกครั้งที่ประชุม *</label>
                <select class="form-select" id="swMeetingPick"></select>
                <div class="form-text" id="swMeetingHint"></div>
              </div>
              <div class="col-6"><label class="form-label">วันที่ประชุม</label>
                <input class="form-control" id="swMeetDateAuto" readonly></div>
              <div class="col-6"><label class="form-label">วาระที่</label>
                <input class="form-control" id="swAgendaNoAuto" readonly></div>
            </div>
            <div id="swNewBox" class="row g-2 mb-2 d-none">
              <div class="col-4"><label class="form-label">ครั้งที่ประชุม *</label>
                <input class="form-control" id="swMeetNo" placeholder="เช่น 41/2569"></div>
              <div class="col-4"><label class="form-label">วันที่ประชุม *</label>
                <input class="form-control" id="swMeetDate" type="date"></div>
              <div class="col-4"><label class="form-label">วาระที่ *</label>
                <input class="form-control" id="swAgendaNo" placeholder="เช่น 5.1"></div>
            </div>
            <div class="mb-2"><label class="form-label">ลักษณะเรื่อง *</label>
              <input class="form-control" id="swItemTopic" value="${ECMIS.escapeHtml(defaultTopic)}"></div>
            <div class="mb-2">
              <label class="form-label d-flex justify-content-between align-items-center mb-1">
                <span>เลขที่เรื่อง (หมวดหมู่เดียวกัน 1 วาระบรรจุได้หลายเรื่อง — เพิ่มช่องได้)</span>
                <button type="button" id="swBtnAddCaseRow" class="btn btn-sm btn-link p-0" style="font-size:.8rem"><i class="fa-solid fa-plus me-1"></i>เพิ่มเลขที่เรื่อง</button>
              </label>
              <div id="swItemCaseList"></div>
            </div>
            <div class="mb-1"><label class="form-label">ชั้นความลับของหนังสือเชิญประชุม</label>
              <select class="form-select" id="swSecrecy">
                <option value="SECRET" selected>ลับ — แนบระเบียบวาระเต็ม (พาดพิงสำนวนคดี)</option>
                <option value="NORMAL">ปกติ — ไม่แนบระเบียบวาระเต็ม</option>
              </select>
            </div>
          </div>`,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'ยืนยันบรรจุวาระ',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#0F2A62',
        didOpen: () => {
          const pick = document.getElementById('swMeetingPick');
          const urgentBox = document.getElementById('swUrgentToggle');
          function syncAuto() {
            const meetings = meetingsOpenForPopup(urgentBox.checked);
            const m = meetings.find(x => String(x.trc_id) === pick.value);
            document.getElementById('swMeetDateAuto').value = m ? ECMIS.thaiDate(m.date) : '';
            document.getElementById('swAgendaNoAuto').value = m ? nextAgendaNoForPopup(m) : '';
          }
          function renderPick() {
            const meetings = meetingsOpenForPopup(urgentBox.checked);
            pick.innerHTML = meetings.map(m =>
              `<option value="${m.trc_id}">ครั้งที่ ${m.no} — วันที่ ${ECMIS.thaiDate(m.date)} (บรรจุแล้ว ${m.agendaCount} วาระ)</option>`
            ).join('') || '<option value="">— ไม่มีครั้งประชุมที่เปิดรับวาระ —</option>';
            document.getElementById('swMeetingHint').textContent = urgentBox.checked
              ? 'โหมดวาระเร่งด่วน: แสดงทุกครั้งประชุมรวมถึงที่ใกล้ปิดรับวาระ'
              : 'แสดงเฉพาะครั้งประชุมที่ยังเปิดรับวาระตามปกติ (เหลือเวลามากกว่า 3 วัน)';
            syncAuto();
          }
          function syncMode() {
            const existing = document.querySelector('input[name="swAgendaMode"]:checked').value === 'EXISTING';
            document.getElementById('swExistingBox').classList.toggle('d-none', !existing);
            document.getElementById('swNewBox').classList.toggle('d-none', existing);
          }
          document.querySelectorAll('input[name="swAgendaMode"]').forEach(r => r.addEventListener('change', syncMode));
          pick.addEventListener('change', syncAuto);
          urgentBox.addEventListener('change', renderPick);
          renderPick();

          /* แถวเลขที่เรื่องแบบเพิ่มได้ — pattern เดียวกับ "เพิ่มวาระ" ใน
             agenda-detail.html (หมวดหมู่เดียวกัน 1 วาระบรรจุได้หลายเรื่อง)
             แถวแรก prefill ด้วยเรื่องที่กดมาจากคิว */
          const caseRowHtml = (value = '') => `
            <div class="input-group input-group-sm mb-2 case-ref-row">
              <input type="text" class="form-control case-ref-input" value="${ECMIS.escapeHtml(value)}" placeholder="เช่น 1234/2569">
              <button type="button" class="btn btn-outline-secondary btn-remove-case-row" tabindex="-1"><i class="fa-solid fa-xmark"></i></button>
            </div>`;
          const listEl = document.getElementById('swItemCaseList');
          const addCaseRow = (value = '') => { listEl.insertAdjacentHTML('beforeend', caseRowHtml(value)); };
          listEl.addEventListener('click', e => {
            const btn = e.target.closest('.btn-remove-case-row');
            if (!btn) return;
            if (listEl.querySelectorAll('.case-ref-row').length > 1) btn.closest('.case-ref-row').remove();
            else btn.closest('.case-ref-row').querySelector('.case-ref-input').value = '';
          });
          document.getElementById('swBtnAddCaseRow').addEventListener('click', () => addCaseRow());
          addCaseRow(c.id);
        },
        preConfirm: () => {
          const existingMode = document.querySelector('input[name="swAgendaMode"]:checked').value === 'EXISTING';
          const urgent = document.getElementById('swUrgentToggle').checked;
          const topic = document.getElementById('swItemTopic').value.trim();
          if (!topic) { Swal.showValidationMessage('กรุณากรอกลักษณะเรื่อง'); return false; }
          const caseNos = Array.from(document.querySelectorAll('.case-ref-input')).map(el => el.value.trim()).filter(Boolean);
          const seen = new Set();
          const dupes = [];
          caseNos.forEach(v => { const key = v.toLowerCase(); if (seen.has(key)) dupes.push(v); else seen.add(key); });
          if (dupes.length) { Swal.showValidationMessage(`กรอกเลขที่เรื่องซ้ำกัน: ${dupes.join(', ')}`); return false; }
          let trcId = null, meetNo, meetDate, agendaNo;
          if (existingMode) {
            const meetings = meetingsOpenForPopup(urgent);
            const m = meetings.find(x => String(x.trc_id) === document.getElementById('swMeetingPick').value);
            if (!m) { Swal.showValidationMessage('กรุณาเลือกครั้งที่ประชุม'); return false; }
            trcId = m.trc_id; meetNo = m.no; meetDate = m.date; agendaNo = nextAgendaNoForPopup(m);
          } else {
            meetNo = document.getElementById('swMeetNo').value.trim();
            meetDate = document.getElementById('swMeetDate').value;
            agendaNo = document.getElementById('swAgendaNo').value.trim();
            if (!meetNo || !meetDate || !agendaNo) {
              Swal.showValidationMessage('กรุณากรอกครั้งที่ประชุม วันที่ประชุม และวาระที่ให้ครบถ้วน');
              return false;
            }
          }
          return { existingMode, trcId, meetNo, meetDate, agendaNo, urgent, topic, caseNos, secrecy: document.getElementById('swSecrecy').value };
        }
      });
      if (!form) return;

      const caseCountNote = form.caseNos.length > 1 ? ` (รวม ${form.caseNos.length} เรื่อง)` : '';
      const confirmed = await ECMIS.confirmAction({
        title: 'ยืนยันบรรจุระเบียบวาระ',
        html: `<p>สำนวน <strong>${ECMIS.escapeHtml(form.caseNos.join(', ') || c.id)}</strong>${caseCountNote} จะถูกบรรจุเข้าระเบียบวาระ ครั้งที่ ${ECMIS.escapeHtml(form.meetNo)} วาระที่ ${ECMIS.escapeHtml(form.agendaNo)}${form.urgent ? ' <span class="badge bg-danger">ด่วน</span>' : ''}</p>`,
        confirmText: 'ยืนยันบรรจุวาระ'
      });
      if (!confirmed.isConfirmed) return;

      let trc_id = form.trcId;
      let addedItem = null;
      try {
        if (!form.existingMode) {
          const meeting = await AR.addMeeting({ trc_name: form.meetNo, trc_date: form.meetDate, trc_status: '0' });
          trc_id = meeting.trc_id;
        }
        addedItem = await AR.addItem({
          trc_id, trci_number: form.agendaNo,
          category: resolvedLike ? 'finding' : 'preliminary',
          trci_topic: form.topic,
          case_ref: form.caseNos.length ? form.caseNos.join(', ') : c.id,
          remark: form.urgent ? 'วาระเร่งด่วน' : '-'
        });
        if (form.urgent && c.trr_id) {
          const { error } = await AR.sb.from('tbl_res_request').update({ trr_urgent: true }).eq('trr_id', c.trr_id);
          if (error) throw error;
        }
      } catch (err) {
        console.error('บรรจุระเบียบวาระไม่สำเร็จ:', err);
        ECMIS.toastWarn('บันทึกลงฐานข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง');
        return;
      }
      /* เลขที่เรื่องที่ระบบหาไม่เจอในฐานข้อมูล (พิมพ์ผิด/เลขไม่ตรง) เดิมเงียบสนิท ไม่เชื่อมโยงจริง
         แต่ผู้ใช้เข้าใจว่าบรรจุวาระสำเร็จแล้ว — ต้องเตือนให้เห็นชัดว่าเรื่องไหนไม่ถูกเชื่อมโยง */
      if (addedItem && addedItem.unresolvedCaseNos && addedItem.unresolvedCaseNos.length) {
        ECMIS.toastWarn(`บรรจุวาระสำเร็จ แต่ไม่พบเลขที่เรื่องในระบบ: ${addedItem.unresolvedCaseNos.join(', ')} — สำนวนนี้จะไม่ถูกเชื่อมโยงเข้าครั้งประชุมจริง กรุณาตรวจสอบเลขที่เรื่องอีกครั้ง`);
      }
      ECMIS.toastOk('บรรจุระเบียบวาระเรียบร้อย — กำลังเปิดรายละเอียดวาระของครั้งประชุมนี้');
      setTimeout(() => { location.href = 'agenda-detail.html?meet=' + encodeURIComponent(trc_id); }, 1400);
    }

    function setCategoryFilter(id) {
      categoryFilterVal = id;
      renderCategoryChips();
      renderQueueTable();
    }

    /* ต้องรอ AR.ready ก่อนเสมอ — AR.LINKED_TRR_IDS (ใช้กรองเรื่องที่บรรจุวาระไปแล้วจริงออกจากคิว)
       ถูก populate ระหว่าง AR.ready เท่านั้น ถ้าเรียกคิวก่อนจะกรองซ้ำไม่ได้ (เห็นเรื่องซ้ำในคิว) */
    AR.ready.then(loadQueueCasesFromSupabase).then(cases => {
      queueCases = cases;
      renderCategoryChips();
      renderQueueTable();
    }).catch(err => {
      console.error('โหลดคิวรอบรรจุวาระไม่สำเร็จ:', err);
      ECMIS.toastWarn('โหลดคิวรอบรรจุวาระไม่สำเร็จ');
    });

    let meetSortKey = 'name';
    let meetSortDir = 'desc';
    function meetNameKey(m) {
      const parts = String(m.trc_name).split('/');
      return (parseInt(parts[1], 10) || 0) * 1000 + (parseInt(parts[0], 10) || 0);
    }
    const MEET_SORT_FNS = {
      name: meetNameKey,
      date: m => m.trc_date,
      count: m => AR.itemsOf(m.trc_id).length,
      status: m => parseInt(m.trc_status, 10) || 0
    };
    function updateMeetSortIcons() {
      document.querySelectorAll('.meet-sortable').forEach(th => {
        const icon = th.querySelector('.sort-icon');
        if (th.dataset.sortKey === meetSortKey) {
          icon.className = `fa-solid ms-1 sort-icon ${meetSortDir === 'desc' ? 'fa-sort-down' : 'fa-sort-up'}`;
        } else {
          icon.className = 'fa-solid fa-sort ms-1 sort-icon';
        }
      });
    }
    document.querySelectorAll('.meet-sortable').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.sortKey;
        if (meetSortKey === key) { meetSortDir = meetSortDir === 'desc' ? 'asc' : 'desc'; }
        else { meetSortKey = key; meetSortDir = 'desc'; }
        updateMeetSortIcons();
        renderMeetingList();
      });
    });
    updateMeetSortIcons();

    function renderMeetingList() {
      const tbody = document.getElementById('meetTb');
      document.getElementById('meetCnt').textContent = AR.MEETINGS.length;
      const keyFn = MEET_SORT_FNS[meetSortKey];
      const sorted = [...AR.MEETINGS].sort((a, b) => {
        const ka = keyFn(a), kb = keyFn(b);
        const cmp = ka < kb ? -1 : ka > kb ? 1 : 0;
        return meetSortDir === 'desc' ? -cmp : cmp;
      });
      tbody.innerHTML = sorted.map(m => {
        const count = AR.itemsOf(m.trc_id).length;
        return `
      <tr class="meet-row" data-id="${m.trc_id}">
        <td class="fw-semibold">${m.trc_name}</td>
        <td>${ECMIS.thaiDate(m.trc_date)}</td>
        <td class="text-center">${count}</td>
        <td>${AR.meetingBadge(m.trc_status, m.trc_confirmed)}</td>
        <td class="text-end">
          <span class="meet-row-actions">
            ${mayEdit ? `<button type="button" class="btn-delete-meet" data-id="${m.trc_id}" data-name="${m.trc_name}" title="ลบครั้งที่ประชุมนี้"><i class="fa-solid fa-trash-can"></i></button>` : ''}
            <button type="button" class="btn btn-sm btn-navy px-3 btn-open-meet" data-id="${m.trc_id}">
              <i class="fa-solid fa-pen-to-square me-1"></i>ดำเนินการ
            </button>
          </span>
        </td>
      </tr>`;
      }).join('');
      tbody.querySelectorAll('.meet-row').forEach(tr =>
        tr.addEventListener('click', () => { location.href = `agenda-detail.html?meet=${tr.dataset.id}`; }));
      tbody.querySelectorAll('.btn-open-meet').forEach(btn => btn.addEventListener('click', e => {
        e.stopPropagation();
        location.href = `agenda-detail.html?meet=${btn.dataset.id}`;
      }));
      tbody.querySelectorAll('.btn-delete-meet').forEach(btn => btn.addEventListener('click', async e => {
        e.stopPropagation();
        const trcId = +btn.dataset.id;
        const name = btn.dataset.name;
        const confirmed = await ECMIS.confirmAction({
          title: `ลบครั้งที่ประชุม ${name}?`,
          html: 'ระบบจะซ่อนรายการนี้ออกจากทะเบียน (ข้อมูลยังอยู่ในฐานข้อมูล) เผื่อกรณีต้องการสร้างครั้งที่ประชุมใหม่แทน',
          confirmText: 'ลบ', danger: true
        });
        if (!confirmed.isConfirmed) return;
        try {
          await AR.deleteMeeting(trcId);
        } catch (err) {
          console.error('ลบครั้งที่ประชุมไม่สำเร็จ:', err);
          ECMIS.toastWarn('ลบไม่สำเร็จ ลองใหม่อีกครั้ง');
          return;
        }
        ECMIS.toastOk(`ลบครั้งที่ประชุม ${name} เรียบร้อย`);
        renderMeetingList();
      }));
    }

    function nextMeetName() {
      const buddhistYear = new Date().getFullYear() + 543;
      const maxNo = AR.MEETINGS.reduce((max, m) => {
        const parts = String(m.trc_name).split('/');
        const no = parseInt(parts[0], 10) || 0;
        const yr = parseInt(parts[1], 10) || 0;
        return yr === buddhistYear && no > max ? no : max;
      }, 0);
      return `${maxNo + 1}/${buddhistYear}`;
    }

    /* ข้อ 49 (ชีตติดตามงาน): ล็อกรายชื่อกรรมการ ป.ป.ท. ไว้ใช้ซ้ำทุกครั้งประชุมโดยอัตโนมัติ แทนที่ต้อง
       เลือกใหม่ทุกครั้ง — mock ด้วย localStorage (ไม่มี backend จริง) ปลดล็อกแล้วแก้ไขเฉพาะครั้งประชุม
       นั้นได้ตามปกติที่หน้าบันทึกมติ (resolution.html #boardTb อ่านค่านี้เป็นค่าเริ่มต้นเมื่อยังไม่มี
       kase.boardAttendance ของสำนวนนั้นๆ โดยเฉพาะ) ต้องตรงกับรายชื่อใน resolution.html BOARD ทุกประการ */
    const LOCKED_ROSTER_KEY = 'ecmis.lockedBoardRoster';
    const BOARD_NAMES = [
      'นายวิชัย ยุติธรรม', 'พลเอก จิระ โกมุทพงศ์', 'พันตำรวจโท วันนพ สมจินตนากุล',
      'นายวิเชียร จันทรโณทัย', 'นายพรเทพ อัมพรกลิ่นแก้ว', 'นายกมล สกลเดชา', 'นายสุรพงษ์ อินทรถาวร'
    ];
    function getLockedRoster() {
      try {
        const saved = JSON.parse(localStorage.getItem(LOCKED_ROSTER_KEY) || 'null');
        if (saved && Array.isArray(saved.present)) return saved;
      } catch (e) { /* ค่าเสีย ใช้ default แทน */ }
      return { locked: false, present: BOARD_NAMES.slice() };
    }
    function saveLockedRoster(locked, presentNames) {
      localStorage.setItem(LOCKED_ROSTER_KEY, JSON.stringify({ locked, present: presentNames }));
    }

    document.getElementById('btnAddMeeting').addEventListener('click', () => {
      const roster = getLockedRoster();
      Swal.fire({
        title: 'เพิ่มการประชุมใหม่',
        html: `
          <div class="mb-2"><label class="form-label">ครั้งที่ประชุม *</label>
            <input type="text" id="swMeetName" class="form-control" value="${nextMeetName()}" placeholder="เช่น 56/2569"></div>
          <div class="mb-2"><label class="form-label">วันที่ประชุม *</label>
            <input type="date" id="swMeetDate" class="form-control"></div>
          <div class="row g-2 mb-2">
            <div class="col-6"><label class="form-label">เวลาเริ่มประชุม</label>
              <input type="time" id="swMeetStartTime" class="form-control"></div>
            <div class="col-6"><label class="form-label">เวลาสิ้นสุดประชุม</label>
              <input type="time" id="swMeetEndTime" class="form-control"></div>
          </div>
          <div class="mb-2"><label class="form-label">สถานะ</label>
            <select id="swMeetStatus" class="form-select">
              <option value="0" selected>กำหนดการแล้ว — รอประชุม</option>
              <option value="1">ประชุมแล้ว</option>
              <option value="2">ยกเลิก/เลื่อน</option>
            </select></div>
          <hr>
          <div class="form-check form-switch mb-2">
            <input class="form-check-input" type="checkbox" id="swLockRoster"${roster.locked ? ' checked' : ''}>
            <label class="form-check-label" for="swLockRoster">
              <i class="fa-solid fa-lock me-1"></i>ล็อกรายชื่อกรรมการ ป.ป.ท. — ใช้ชุดนี้เป็นค่าเริ่มต้นให้ทุกวาระ
              ของครั้งประชุมนี้อัตโนมัติ (ยังปลดล็อกแก้ไขเฉพาะวาระได้ที่หน้าบันทึกมติ)
            </label>
          </div>
          <div class="text-start small" style="max-height:160px;overflow-y:auto;border:1px solid #E2E8F0;border-radius:6px;padding:.5rem .75rem">
            ${BOARD_NAMES.map((n, i) => `
              <div class="form-check">
                <input class="form-check-input swRosterMember" type="checkbox" id="swRosterM${i}" value="${ECMIS.escapeHtml(n)}"${roster.present.includes(n) ? ' checked' : ''}>
                <label class="form-check-label" for="swRosterM${i}">${ECMIS.escapeHtml(n)}</label>
              </div>`).join('')}
          </div>`,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'บันทึก',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#0F2A62',
        preConfirm: () => {
          const name = document.getElementById('swMeetName').value.trim();
          const dateInput = document.getElementById('swMeetDate').value;
          if (!name || !dateInput) { Swal.showValidationMessage('กรุณากรอกครั้งที่ประชุมและวันที่ประชุมให้ครบถ้วน'); return false; }
          if (AR.MEETINGS.some(m => m.trc_name === name)) { Swal.showValidationMessage('มีครั้งที่ประชุมนี้อยู่แล้วในทะเบียน'); return false; }
          const locked = document.getElementById('swLockRoster').checked;
          const presentNames = Array.from(document.querySelectorAll('.swRosterMember:checked')).map(el => el.value);
          saveLockedRoster(locked, presentNames);
          /* <input type="date"> คืนค่าปี ค.ศ. จริงเสมอ ซึ่งตรงกับคอลัมน์ trc_date (type DATE)
             ใน Supabase พอดี — ไม่ต้อง +543 อีกต่อไป (AgendaRegistry แปลงเป็น พ.ศ. ให้เองตอนอ่าน) */
          return {
            name, date: dateInput, status: document.getElementById('swMeetStatus').value,
            startTime: document.getElementById('swMeetStartTime').value,
            endTime: document.getElementById('swMeetEndTime').value
          };
        }
      }).then(async res => {
        if (!res.isConfirmed) return;
        let meeting;
        try {
          meeting = await AR.addMeeting({
            trc_name: res.value.name, trc_date: res.value.date, trc_status: res.value.status,
            trc_start_time: res.value.startTime, trc_end_time: res.value.endTime
          });
        } catch (err) {
          console.error('เพิ่มการประชุมไม่สำเร็จ:', err);
          ECMIS.toastWarn('บันทึกลงฐานข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง');
          return;
        }
        ECMIS.toastOk(`เพิ่มการประชุมครั้งที่ ${res.value.name} เรียบร้อย — กำลังเปิดหน้ารายละเอียด`);
        setTimeout(() => { location.href = `agenda-detail.html?meet=${meeting.trc_id}`; }, 700);
      });
    });

    AR.ready.then(() => {
      renderMeetingList();
    }).catch(err => {
      console.error('โหลดทะเบียนวาระการประชุมไม่สำเร็จ:', err);
      ECMIS.toastWarn('โหลดข้อมูลจากฐานข้อมูลไม่สำเร็จ');
    });
  </script>
</body>

</html>
