                    <div class="card-body">
                        <div class="btn-group mb-3" role="group" id="agendaModeGroup">
                            <input type="radio" class="btn-check" name="agendaMode" id="modeExisting" value="EXISTING" checked>
                            <label class="btn btn-outline-navy btn-sm" for="modeExisting">

                            <div class="col-md-4"><label class="form-label field-req">ครั้งที่ประชุม</label>
                                <input class="form-control" id="meetNo" value="39/2569">
                            </div>
                            <div class="col-md-4"><label class="form-label field-req">วันที่ประชุม</label>
                                <input class="form-control" id="meetDate" value="2569-06-16" type="text">
                            </div>
                            <div class="col-md-4"><label class="form-label field-req">วาระที่</label>

                        <div class="mb-3">

                                <option value="SECRET" selected>ลับ — แนบระเบียบวาระเต็ม (พาดพิงสำนวนคดี)</option>

                      </div>

                    <!-- Symmetrical Pagination & Zoom Navigator Bar -->

                      <!-- Left Group: View Mode & Page Jump Controls -->

                            <i class="fa-solid fa-file me-1"></i>ดูทีละหน้า
                          </button>
                          <button type="button" class="btn btn-xs btn-outline-light btn-toolbar-nav" id="btnModeContinuous" title="โหมดดูทุกหน้าเรียงกัน">
                            <i class="fa-solid fa-file-lines me-1"></i>ดูทุกหน้าต่อเนื่อง
                          </button>

                        <div class="toolbar-divider"></div>

                        <div class="btn-group btn-group-sm" role="group">
                          <button type="button" class="btn btn-xs btn-secondary btn-toolbar-nav" id="btnFirstPage" title="หน้าแรกสุด (หน้า 1)"><i class="fa-solid fa-backward-step"></i></button>

                          <button type="button" class="btn btn-xs btn-secondary btn-toolbar-nav" id="btnLastPage" title="หน้าสุดท้าย"><i class="fa-solid fa-forward-step"></i></button>
                        </div>

                      <!-- Right Group: Zoom Stepper Controls -->

                          <button type="button" class="btn btn-link btn-xs text-light p-1 text-decoration-none" id="btnZoomIn" title="ขยายขนาด"><i class="fa-solid fa-magnifying-glass-plus"></i></button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/pizzip@3/dist/pizzip.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docxtemplater@3/build/docxtemplater.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

    <script src="../assets/ecmis-model.js"></script>
    <script src="../assets/agenda-registry-data.js"></script>
    <script>
        ECMIS.renderShell('agenda.html');

        const params = new URLSearchParams(location.search);
        const role = ECMIS.currentRole();

        const CAN_ACT_ROLE = 'board_sec';

        const SUPABASE_URL = 'https://ljhabbwjxnoucrcrsoii.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_2Bps-dWMZHz_7cs3BppF6A_ul1_A_xd';
        const sb = (window.ECMIS && window.ECMIS.getSupabaseClient) ? window.ECMIS.getSupabaseClient(SUPABASE_URL, SUPABASE_KEY) : (window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } }) : null);

        async function loadCaseFromSupabase(caseId) {
            const { data, error } = await sb
                .from('tbl_res_request')
                .select('*, tbl_cmp_case!inner(*, tbl_cmp_case_accused(*))')
                .eq('tbl_cmp_case.tcc_no', caseId)
                .eq('is_deleted', false)
                .maybeSingle();
            if (error) throw error;
            return data ? ECMIS.supabaseRowToCase(data) : null;
        }

        /* บันทึกสถานะจริงกลับ tbl_res_request — เดิมหน้านี้เขียนแค่ ECMIS.Model.CaseStore (mock)
           ทำให้สำนวนไม่หลุดจากคิวรอบรรจุวาระจริง (agenda-registry.html อ่าน trr_status จริง) */
        async function persistCase(kase, patch) {
            const dbPatch = {};
            if ('status' in patch) {
                const code = ECMIS.STATUS_CODE[patch.status];
                if (!code) throw new Error(`ไม่พบรหัสสถานะสำหรับ ${patch.status}`);
                dbPatch.trr_status = code;
            }
            if ('urgent' in patch) dbPatch.trr_urgent = patch.urgent;
            const { error } = await sb.from('tbl_res_request').update(dbPatch).eq('trr_id', kase.trr_id);
            if (error) throw error;
            Object.assign(kase, patch);
        }

        let kase, docType, isRuling;

        (async function main() {
            try {
                kase = await loadCaseFromSupabase(params.get('case') || '1547/2568');
            } catch (err) {
                console.error('โหลดข้อมูลจากฐานข้อมูลไม่สำเร็จ:', err);
                ECMIS.toastWarn('โหลดข้อมูลจากฐานข้อมูลไม่สำเร็จ');
                return;
            }
            if (!kase) { ECMIS.toastWarn('ไม่พบสำนวนนี้ในระบบ'); return; }

            docType = ECMIS.DOC_TYPES[kase.docType];
            isRuling = docType.code === 'RULING';

            document.getElementById('stBadge').innerHTML = `<span class="chip me-1">เลขสำนวน ${kase.id}</span>` + ECMIS.statusBadge(kase.status) + ' ' + ECMIS.slaBadge(kase);
            document.getElementById('stepper').innerHTML = isRuling
                ? ECMIS.stepperHtml(kase.status, ECMIS.FLOW_STEPS_72, ECMIS.STATUS_STEP_72)
                : ECMIS.stepperHtml(kase.status);

            if (isRuling) { initAgenda72(); } else { initAgenda71(); }
        })();

        async function initAgenda71(){
        let docTab = 'agenda';
        const AR = window.AgendaRegistry;

        /* ครั้งประชุมจริงจาก tbl_res_calendar (ผ่าน agenda-registry-data.js — module เดียวกับที่
           13/14-agenda-registry*.html ใช้) เดิมหน้านี้ใช้ mock array ของตัวเอง ทำให้เลขครั้งประชุม/
           วันที่ที่เห็นในหน้านี้ไม่ตรงกับที่มีอยู่จริงในทะเบียนวาระ — แก้ให้อ่านชุดเดียวกันแทน
           เฉพาะครั้งที่ยังไม่ประชุม (trc_status='0') เท่านั้นที่เปิดให้เลือกได้ */
        function meetingsOpen() {
            let list = AR.MEETINGS.filter(m => m.trc_status === '0').map(m => ({
                no: m.trc_name, date: m.trc_date, trc_id: m.trc_id,
                agendaCount: AR.itemsOf(m.trc_id).length,
                closesInDays: ECMIS.daysUntilFakeIso(m.trc_date)
            }));
            if (!list.length) {
                list = [
                    { no: '38/2569', date: '2569-06-02', trc_id: 101, agendaCount: 5, closesInDays: 14 },
                    { no: '39/2569', date: '2569-06-16', trc_id: 102, agendaCount: 2, closesInDays: 28 },
                    { no: '40/2569 (วาระพิเศษ)', date: '2569-06-23', trc_id: 103, agendaCount: 0, closesInDays: 35 }
                ];
            }
            return list;
        }
        const nextAgendaNo = m => `5.${m.agendaCount + 1}`;

        function selectableMeetings() {
            const urgent = document.getElementById('urgentToggle').checked;
            const meetings = meetingsOpen();
            return urgent ? meetings : meetings.filter(m => m.closesInDays > 3);
        }

        function renderMeetingPick() {
            const meetings = selectableMeetings();
            const pick = document.getElementById('meetingPick');
            const prevVal = pick.value;
            pick.innerHTML = meetings.map(m =>
                `<option value="${m.trc_id}">ครั้งที่ ${m.no} — วันที่ ${ECMIS.thaiDate(m.date)} (บรรจุแล้ว ${m.agendaCount} วาระ)</option>`
            ).join('') || '<option value="">— ไม่มีครั้งประชุมที่เปิดรับวาระ —</option>';
            if (meetings.some(m => String(m.trc_id) === prevVal)) pick.value = prevVal;
            document.getElementById('meetingPickHint').textContent =
                document.getElementById('urgentToggle').checked
                    ? 'โหมดวาระเร่งด่วน: แสดงทุกครั้งประชุมรวมถึงที่ใกล้ปิดรับวาระ ข้ามการตรวจลำดับวาระปกติ'
                    : 'แสดงเฉพาะครั้งประชุมที่ยังเปิดรับวาระตามปกติ (เหลือเวลามากกว่า 3 วัน)';
            syncMeetingAuto();
        }

        function syncMeetingAuto() {
            const meetings = meetingsOpen();
            const m = meetings.find(x => String(x.trc_id) === document.getElementById('meetingPick').value);
            document.getElementById('meetDateAuto').value = m ? ECMIS.thaiDate(m.date) : '';
            document.getElementById('agendaNoAuto').value = m ? nextAgendaNo(m) : '';
            renderDoc();
        }

        function getActiveAgendaValues() {
            if (document.querySelector('input[name="agendaMode"]:checked').value === 'EXISTING') {
                const m = meetingsOpen().find(x => String(x.trc_id) === document.getElementById('meetingPick').value);
                return m ? { trcId: m.trc_id, meetNo: m.no, meetDate: m.date, agendaNo: nextAgendaNo(m) } : { trcId: null, meetNo: '', meetDate: '', agendaNo: '' };
            }
            return {
                trcId: null,
                meetNo: document.getElementById('meetNo').value.trim(),
                meetDate: document.getElementById('meetDate').value.trim(),
                agendaNo: document.getElementById('agendaNo').value.trim()
            };
        }

        function syncModeVisibility() {
            const existing = document.querySelector('input[name="agendaMode"]:checked').value === 'EXISTING';
            document.getElementById('modeExistingBox').classList.toggle('d-none', !existing);
            document.getElementById('modeNewBox').classList.toggle('d-none', existing);
            renderDoc();
        }

        await AR.ready;
        renderMeetingPick();
        document.querySelectorAll('input[name="agendaMode"]').forEach(r => r.addEventListener('change', syncModeVisibility));
        document.getElementById('meetingPick').addEventListener('change', syncMeetingAuto);
        document.getElementById('urgentToggle').addEventListener('change', renderMeetingPick);

        function renderDoc() {
            const M = ECMIS.mergeField;
            const active = getActiveAgendaValues();
            const meetNo = active.meetNo;
            const meetDate = ECMIS.thaiDate(active.meetDate);
            const agendaNo = active.agendaNo;
            const secrecy = document.getElementById('secrecy').value;
            const docPaperEl = document.getElementById('docPaper');
            if (!docPaperEl) return;

            if (docTab === 'agenda') {
                docPaperEl.innerHTML = `
      <div class="doc-paper a4-paper active-page" id="docPaperPage">
        <div class="doc-secret">${secrecy === 'SECRET' ? 'ลับ' : ''}</div>
        <div class="doc-title">ระเบียบวาระการประชุม<br>คณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ</div>
        <div class="doc-sub">ครั้งที่ ${M(meetNo)} วันที่ ${M(meetDate)}</div>

        <div class="doc-h">ระเบียบวาระที่ 5 &nbsp; เรื่องเพื่อพิจารณา</div>
        <div style="margin-top:6px">
          <div class="doc-row"><span class="k">วาระที่ ${M(agendaNo)}</span> ${M(kase.subject)}</div>
          <div style="padding-left:2em">
            <div class="doc-row"><span class="k">เรื่องที่</span> ${M(kase.id)}</div>
            <div class="doc-row"><span class="k">ผู้รับผิดชอบ</span> ${M(kase.owner)}</div>
            <div class="doc-row"><span class="k">สังกัด</span> ${M(kase.ownerOrg)}</div>
            <div class="doc-row"><span class="k">ผู้ชี้แจง</span>
              ${M(kase.subCommittee ? `ฝ่ายเลขานุการคณะอนุกลั่นกรองฯ (${kase.subCommittee})` : 'ฝ่ายเลขานุการคณะกรรมการ ป.ป.ท.')}</div>
            <div class="doc-row"><span class="k">เอกสารอ้างอิง</span> ${M(kase.docRef)}</div>
            <div class="doc-row"><span class="k">ชั้นการพิจารณา</span> ไต่สวนเบื้องต้น</div>
          </div>
        </div>

        <div class="doc-h">ผู้ถูกร้อง</div>
        ${(kase.accused || []).map(a => `<div style="padding-left:1em">${a.no || 1}. ${M(a.name)} — ${M(a.pos)}</div>`).join('')}

        <div class="doc-h">ประเด็นเสนอที่ประชุม</div>
        <div class="doc-indent">
          ${M(kase.ownerOrg)} เสนอรายงานการไต่สวนเบื้องต้นที่ผ่านการพิจารณาของ
          เลขาธิการคณะกรรมการ ป.ป.ท. แล้ว เพื่อโปรดพิจารณามีมติ
        </div>
      </div>`;
            } else {
                docPaperEl.innerHTML = `
      <div class="doc-paper a4-paper active-page" id="docPaperPage">
        <div class="doc-secret">${secrecy === 'SECRET' ? 'ลับ' : ''}</div>
        <div class="doc-title">บันทึกข้อความ</div>
        <div style="margin-top:14px">
          <div class="doc-row"><span class="k">ส่วนราชการ</span> กองบริหารคดี สำนักงาน ป.ป.ท.</div>
          <div class="doc-row"><span class="k">ที่</span> ${M('', 'ปป …………/………')}
            <span class="k" style="margin-left:24px">วันที่</span> ${M('', '……………………')}</div>
          <div class="doc-row"><span class="k">เรื่อง</span> ขอเรียนเชิญประชุมคณะกรรมการ ป.ป.ท. ครั้งที่ ${M(meetNo)}</div>
        </div>
        <div style="margin-top:12px">เรียน &nbsp; ประธานกรรมการและกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ ทุกท่าน</div>
        <div class="doc-indent" style="margin-top:12px">
          ด้วยสำนักงาน ป.ป.ท. กำหนดจัดประชุมคณะกรรมการป้องกันและปราบปรามการทุจริตในภาครัฐ
          ครั้งที่ ${M(meetNo)} ในวันที่ ${M(meetDate)} เวลา ${M('', '……… น.')}
          ณ ห้องประชุมสำนักงาน ป.ป.ท.
        </div>
        <div class="doc-indent" style="margin-top:8px">
          ในการนี้ จึงขอเรียนเชิญท่านเข้าร่วมประชุมตามวัน เวลา และสถานที่ดังกล่าว
          โดยได้แนบระเบียบวาระการประชุมมาพร้อมนี้
          ${secrecy === 'SECRET'
                          ? '<strong>(เอกสารชั้นความลับ — โปรดอย่าเผยแพร่)</strong>'
                          : '<span style="color:#666">(ไม่ได้แนบระเบียบวาระเต็ม)</span>'}
        </div>
        <div class="doc-indent" style="margin-top:8px">จึงเรียนมาเพื่อโปรดทราบและเข้าร่วมประชุม</div>
        <div class="doc-sign">
          <span class="doc-dots"></span><br>(นายธนกฤต บุญมี)<br>
          เจ้าหน้าที่กลุ่มงานคำวินิจฉัยและมติคณะกรรมการ กองบริหารคดี
        </div>
      </div>`;
            }
            updatePaginationUI();
            applyZoom();
        }

        document.querySelectorAll('#docTabs [data-doc]').forEach(b => b.addEventListener('click', () => {
            document.querySelectorAll('#docTabs .ws-doc-tab').forEach(x => x.classList.remove('active'));
            b.classList.add('active'); docTab = b.dataset.doc; renderDoc();
        }));
        ['meetNo', 'meetDate', 'agendaNo'].forEach(id =>
            document.getElementById(id).addEventListener('input', renderDoc));
        document.getElementById('secrecy').addEventListener('change', renderDoc);
        syncModeVisibility();

        function renderActions() {
            const slot = document.getElementById('actionBarSlot');
            if (role.id !== CAN_ACT_ROLE) {
                const owner = ECMIS.getRole(CAN_ACT_ROLE);
                slot.innerHTML = `<div class="no-permission">
          <i class="fa-solid fa-lock me-1"></i>
          บทบาท <strong>${role.title}</strong> ไม่มีสิทธิ์บรรจุระเบียบวาระในหน้านี้
          — ดำเนินการโดย <strong>${owner.title}</strong> (สิทธิ์ create.agenda / create.invite)
        </div>`;
                return;
            }
            slot.innerHTML = `
        <button type="button" class="btn btn-outline-secondary btn-sm" data-act="save">
          <i class="fa-solid fa-floppy-disk me-1"></i>บันทึกร่าง</button>
        <button type="button" class="btn btn-navy btn-sm" data-act="submit">
          <i class="fa-solid fa-paper-plane me-1"></i>ยืนยันบรรจุวาระ — ส่งต่อฝ่ายเลขานุการบอร์ด</button>`;
            document.querySelectorAll('#actionBarSlot [data-act]').forEach(b =>
                b.addEventListener('click', () => handle(b.dataset.act)));
        }

        async function handle(act) {
            if (act === 'save') { ECMIS.toastOk('บันทึกร่างระเบียบวาระเรียบร้อย'); return; }
            if (act === 'submit') {
                const existingMode = document.querySelector('input[name="agendaMode"]:checked').value === 'EXISTING';
                const { trcId, meetNo, meetDate, agendaNo } = getActiveAgendaValues();
                const urgent = document.getElementById('urgentToggle').checked;
                if (!meetNo || !meetDate || !agendaNo) {
                    ECMIS.toastWarn('กรุณาระบุ ครั้งที่ประชุม, วันที่ประชุม และ วาระที่');
                    return;
                }
                const r = await ECMIS.confirmAction({
                    title: 'ยืนยันบรรจุระเบียบวาระ',
                    html: `<p>สำนวน <strong>${kase.id}</strong> จะถูกบรรจุเข้าระเบียบวาระ ครั้งที่ ${meetNo} วาระที่ ${agendaNo}${urgent ? ' <span class="badge bg-danger">ด่วน</span>' : ''}</p>`,
                    confirmText: 'ยืนยันบรรจุวาระ'
                });
                if (!r.isConfirmed) return;

                let trc_id = trcId;
                try {
                    if (!existingMode) {
                        const meeting = await AR.addMeeting({ trc_name: meetNo, trc_date: meetDate, trc_status: '0' });
                        trc_id = meeting.trc_id;
                    }
                    const resolvedLike = ['RESOLVED_PENDING', 'RESOLVED', 'DISPATCHING', 'CLOSED'].includes(kase.status);
                    await AR.addItem({
                        trc_id, trci_number: agendaNo,
                        category: resolvedLike ? 'finding' : 'preliminary',
                        trci_topic: `รายงานไต่สวน${resolvedLike ? 'เพื่อวินิจฉัยชี้มูล' : 'เบื้องต้น'} กรณี ${kase.subject}`,
                        case_ref: kase.id,
                        remark: urgent ? 'วาระเร่งด่วน' : '-'
                    });
                    /* ไม่เปลี่ยน trr_status ที่นี่ — สำนวนแค่ถูกบรรจุเข้าระเบียบวาระของครั้งประชุมที่ยัง
                       ไม่เกิดขึ้นจริง (IN_MEETING หมายถึง "อยู่ระหว่างประชุมบอร์ด" ซึ่งต้องรอ board_sec
                       เปิดประชุมจริงก่อนตามสถานะ AGENDA_SET→IN_MEETING/OPEN_AGENDA) การมีลิงก์จริงใน
                       tbl_res_calendar_item_case ก็เพียงพอให้คิวรอบรรจุวาระกรองเรื่องนี้ออกแล้ว */
                    if (urgent) await persistCase(kase, { urgent });
                } catch (err) {
                    console.error('บรรจุระเบียบวาระไม่สำเร็จ:', err);
                    ECMIS.toastWarn('บันทึกลงฐานข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง');
                    return;
                }
                ECMIS.toastOk('บรรจุระเบียบวาระเรียบร้อย — กำลังเปิดรายละเอียดวาระของครั้งประชุมนี้');
                setTimeout(() => location.href = 'agenda-detail.html?meet=' + encodeURIComponent(trc_id), 1400);
            }
        }

        renderDoc(); renderActions();
        }

        function initAgenda72(){
            document.getElementById('agendaCard').classList.add('d-none');
            document.getElementById('docCol').classList.add('d-none');
            document.getElementById('checklistCard72').classList.remove('d-none');
            document.getElementById('boardInviteCard72').classList.remove('d-none');

            const CHECKLIST = ['รายงานวินิจฉัยชี้มูล', 'เอกสารประกอบ', 'ระเบียบวาระ'];
            document.getElementById('checklistBox72').innerHTML = CHECKLIST.map((c, i) => `
    <div class="form-check mb-1">
      <input class="form-check-input checklist-item" type="checkbox" id="cl${i}">
      <label class="form-check-label" for="cl${i}">${c}</label>
    </div>`).join('');
            function checklistComplete(){
                return Array.from(document.querySelectorAll('.checklist-item')).every(el => el.checked);
            }

            const BOARD = [
                { n: 'นายวิชัย ยุติธรรม', r: 'ประธานกรรมการ ป.ป.ท.', chair: true },
                { n: 'นายสมบูรณ์ ธรรมรัฐ', r: 'กรรมการ ป.ป.ท.' },
                { n: 'พันตำรวจโท วันนพ สมจินตนากุล', r: 'กรรมการ ป.ป.ท.' },
                { n: 'นายวิเชียร จันทรโณทัย', r: 'กรรมการ ป.ป.ท.' },
                { n: 'นายพรเทพ อัมพรกลิ่นแก้ว', r: 'กรรมการ ป.ป.ท.' },
                { n: 'นายกมล สกลเดชา', r: 'กรรมการ ป.ป.ท.' },
                { n: 'นายสุรพงษ์ อินทรถาวร', r: 'กรรมการ ป.ป.ท.' }
            ];
            document.getElementById('boardTb72').innerHTML = BOARD.map((b, i) => `
    <tr data-i="${i}">
      <td><strong>${b.n}</strong><br><small class="text-muted">${b.r}</small></td>
      <td>
        <select class="form-select form-select-sm invite-status">
          <option value="NOT_SENT" selected>ยังไม่ส่ง</option>
          <option value="SENT">ส่งแล้ว</option>
          <option value="ACK">รับทราบแล้ว</option>
        </select>
      </td>
    </tr>`).join('');

            /* ---------- actions ---------- */
            const mayEdit = role.id === CAN_ACT_ROLE;
            ECMIS.initDocEditor({ stageId: 'docPaper', mayEdit: mayEdit });

            function buildButtons(){
                return [{ act: 'open', label: 'ส่งหนังสือเชิญประชุมและเปิดวาระ', icon: 'fa-paper-plane', cls: 'btn-navy' }];
            }
            document.getElementById('actionBarSlot').innerHTML = ECMIS.actionBar(kase, role.id, buildButtons());

            function syncOpenButtonState(){
                const btn = document.querySelector('.action-bar [data-act="open"]');
                if (btn) btn.disabled = !checklistComplete();
            }
            document.querySelectorAll('.checklist-item').forEach(el => el.addEventListener('change', syncOpenButtonState));
            syncOpenButtonState();

            document.querySelectorAll('.action-bar [data-act]').forEach(b =>
                b.addEventListener('click', () => handle(b.dataset.act)));

            function handle(act){
                if (act !== 'open') return;
                if (!checklistComplete()) {
                    ECMIS.toastWarn('กรุณาเตรียมเอกสารประกอบวาระให้ครบก่อนส่งหนังสือเชิญประชุม');
                    return;
                }
                const inviteStatus = Array.from(document.querySelectorAll('#boardTb72 tr')).map((tr, i) => ({
                    name: BOARD[i].n,
                    status: tr.querySelector('.invite-status').value
                }));

                ECMIS.confirmAction({
                    title: 'ส่งหนังสือเชิญประชุมและเปิดวาระ',
                    html: `<p>สำนวน <strong>${kase.id}</strong> — เอกสารประกอบวาระครบถ้วนแล้ว</p>`,
                    confirmText: 'ยืนยันส่งหนังสือเชิญประชุม'
                }).then(res => {
                    if (!res.isConfirmed) return;
                    ECMIS.Model.CaseStore.update(kase.id, {
                        inviteChecklist72: CHECKLIST.slice(),
                        inviteStatus72: inviteStatus,
                        inviteSentDate72: new Date().toISOString().slice(0, 10),
                        status: 'IN_MEETING_72'
                    });
                    ECMIS.toastOk('ส่งหนังสือเชิญประชุมและเปิดวาระเรียบร้อย');
                    setTimeout(() => location.href = ECMIS.pageForCase72(kase) + '?case=' + encodeURIComponent(kase.id), 1400);
                });
            }
        }

        /* ---------- Document workspace: collapsible pane ---------- */
        const docWorkspace = document.getElementById('docWorkspace');
        const PANE_KEY = 'ecmis-agenda-set-docpane-collapsed';
        function setPaneCollapsed(collapsed) {
            if (docWorkspace) docWorkspace.classList.toggle('pane-collapsed', collapsed);
            localStorage.setItem(PANE_KEY, collapsed ? '1' : '0');
        }
        if (localStorage.getItem(PANE_KEY) === '1') setPaneCollapsed(true);
        const btnCollapse = document.getElementById('btnPaneCollapse');
        const btnExpand = document.getElementById('btnPaneExpand');
        if (btnCollapse) btnCollapse.addEventListener('click', () => setPaneCollapsed(true));
        if (btnExpand) btnExpand.addEventListener('click', () => setPaneCollapsed(false));

        /* ---------- Master Toolbar & Pagination Controls ---------- */
        let docViewMode = 'SINGLE';
        let docCurrentPage = 1;
        let docTotalPages = 1;
        let docZoomLevel = 0.75;

        function updatePaginationUI() {
            const docPaperEl = document.getElementById('docPaper');
            if (!docPaperEl) return;
            const pages = docPaperEl.querySelectorAll('.doc-paper, .a4-paper');
            docTotalPages = Math.max(1, pages.length);

            if (docCurrentPage > docTotalPages) docCurrentPage = docTotalPages;
            if (docCurrentPage < 1) docCurrentPage = 1;

            $('#totalPagesText').text(`/ ${docTotalPages} หน้า`);
            $('#pageNumberInput').attr('max', docTotalPages).val(docCurrentPage);

            if (docViewMode === 'SINGLE') {
                docPaperEl.classList.remove('mode-continuous');
                docPaperEl.classList.add('mode-single');
                pages.forEach((p, idx) => {
                    if (idx + 1 === docCurrentPage) {
                        p.classList.add('active-page');
                        p.style.display = 'block';
                    } else {
                        p.classList.remove('active-page');
                        p.style.display = 'none';
                    }
                });
                $('#btnModeSingle').removeClass('btn-outline-light').addClass('btn-primary');
                $('#btnModeContinuous').removeClass('btn-primary').addClass('btn-outline-light');
                $('#btnFirstPage, #btnPrevPage').prop('disabled', docCurrentPage === 1);
                $('#btnNextPage, #btnLastPage').prop('disabled', docCurrentPage === docTotalPages);
                $('#pageNumberInput').prop('disabled', false);
                const stage = document.getElementById('docPaperStage');
                if (stage) stage.scrollTop = 0;
            } else {
                docPaperEl.classList.remove('mode-single');
                docPaperEl.classList.add('mode-continuous');
                pages.forEach(p => {
                    p.classList.add('active-page');
                    p.style.display = 'block';
                });
                $('#btnModeContinuous').removeClass('btn-outline-light').addClass('btn-primary');
                $('#btnModeSingle').removeClass('btn-primary').addClass('btn-outline-light');
                $('#btnFirstPage, #btnPrevPage, #btnNextPage, #btnLastPage, #pageNumberInput').prop('disabled', true);
            }
            applyZoom();
        }

        function applyZoom() {
            const docPaperEl = document.getElementById('docPaper');
            if (!docPaperEl) return;
            docPaperEl.style.transform = `scale(${docZoomLevel})`;
            docPaperEl.style.transformOrigin = 'top center';
            $('#zoomLevelText').text(`${Math.round(docZoomLevel * 100)}%`);

            const stage = document.getElementById('docPaperStage');
            if (stage) {
                const pages = docPaperEl.querySelectorAll('.doc-paper, .a4-paper');
                if (pages.length > 0) {
                    if (docViewMode === 'SINGLE') {
                        const activeP = docPaperEl.querySelector('.doc-paper.active-page, .a4-paper.active-page') || pages[0];
                        const h = activeP ? (activeP.offsetHeight || 1123) : 1123;
                        docPaperEl.style.height = `${Math.round(h * docZoomLevel)}px`;
                    } else {
                        let totalH = 0;
                        pages.forEach(p => { totalH += (p.offsetHeight || 1123) + 18; });
                        docPaperEl.style.height = `${Math.round(totalH * docZoomLevel)}px`;
                    }
                }
            }
        }

        $('#btnModeSingle').on('click', function () {
            docViewMode = 'SINGLE';
            updatePaginationUI();
        });

        $('#btnModeContinuous').on('click', function () {
            docViewMode = 'CONTINUOUS';
            updatePaginationUI();
        });

        $('#btnFirstPage').on('click', function () {
            if (docCurrentPage > 1) {
                docCurrentPage = 1;
                updatePaginationUI();
            }
        });

        $('#btnPrevPage').on('click', function () {
            if (docCurrentPage > 1) {
                docCurrentPage--;
                updatePaginationUI();
            }
        });

        $('#btnNextPage').on('click', function () {
            if (docCurrentPage < docTotalPages) {
                docCurrentPage++;
                updatePaginationUI();
            }
        });

        $('#btnLastPage').on('click', function () {
            if (docCurrentPage < docTotalPages) {
                docCurrentPage = docTotalPages;
                updatePaginationUI();
            }
        });

        $('#pageNumberInput').on('change', function () {
            let val = parseInt($(this).val(), 10);
            if (isNaN(val) || val < 1) val = 1;
            if (val > docTotalPages) val = docTotalPages;
            docCurrentPage = val;
            updatePaginationUI();
        });

        $('#btnZoomIn').on('click', function () {
            if (docZoomLevel < 1.5) {
                docZoomLevel = Math.min(1.5, Math.round((docZoomLevel + 0.1) * 10) / 10);
                applyZoom();
            }
        });

        $('#btnZoomOut').on('click', function () {
            if (docZoomLevel > 0.4) {
                docZoomLevel = Math.max(0.4, Math.round((docZoomLevel - 0.1) * 10) / 10);
                applyZoom();
            }
        });

        $('#btnDocx').on('click', function () {
            if (typeof ECMIS !== 'undefined' && typeof ECMIS.exportDocToDocx === 'function') {
                const title = docTab === 'agenda' ? 'ระเบียบวาระการประชุม' : 'หนังสือเชิญประชุม';
                ECMIS.exportDocToDocx('docPaper', `${title}_${kase.id.replace(/\//g, '-')}.docx`);
            } else {
                window.print();
            }
        });

        try {
            const mayEdit = (role.id === 'board_sec' || role.id === 'admin');
            ECMIS.initDocEditor({ stageId: 'docPaper', mayEdit: mayEdit });
        } catch (e) { }
    </script>
</body>

</html>
