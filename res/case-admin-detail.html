<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายละเอียดคดี | กองบริหารคดี | E-CMIS</title>
  <link rel="icon" type="image/png" href="../assets/pacc_logo.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="../assets/ecmis-app.css" rel="stylesheet">
  <style>
    .kv { display: grid; grid-template-columns: 150px 1fr; gap: .3rem .8rem; font-size: .86rem; }
    .kv dt { color: var(--ecmis-muted); font-weight: 600; }
    .kv dd { margin: 0; }
    .law-row { display: flex; gap: .6rem; padding: .5rem 0; border-bottom: 1px dashed var(--border-divider); font-size: .84rem; }
    .law-row:last-child { border-bottom: none; }
    .law-row .chip { flex-shrink: 0; align-self: flex-start; }
    .dl-table td { font-size: .84rem; vertical-align: top; padding: .4rem .5rem; }
    @media(max-width:700px){ .kv { grid-template-columns: 1fr; } }
  </style>
</head>

<body>

  <main class="app-main">
    <div class="page-head">
      <div>
        <a href="case-admin-inbox.html" class="text-decoration-none small d-block mb-1"
          style="color:var(--ecmis-muted)"><i class="fa-solid fa-arrow-left me-1"></i>กลับรายการคดี</a>
        <h1><i class="fa-solid fa-folder-open me-2" style="color:#0F2A62"></i><span id="pageTitle">รายละเอียดคดี</span></h1>
      </div>
    </div>

    <div id="notFoundBox" class="alert alert-warning d-none">ไม่พบคดีนี้ในระบบ — <a href="case-admin-inbox.html">กลับรายการคดี</a></div>

    <div id="detailWrap" class="d-none">

      <!-- 1. หัวคดี -->
      <div class="card card-ecmis mb-3">
        <div class="card-header d-flex align-items-center flex-wrap gap-2">
          <i class="fa-solid fa-circle-info text-primary"></i><span class="fw-bold">หัวคดี</span>
          <span class="ms-auto d-flex align-items-center gap-2" id="headBadges"></span>
        </div>
        <div class="card-body">
          <dl class="kv" id="headKv"></dl>
          <div class="mt-3 d-flex align-items-center gap-2 flex-wrap" id="headActions"></div>
        </div>
      </div>

      <!-- 2. ขั้นตอนด่านรับ -->
      <div class="card card-ecmis mb-3">
        <div class="card-header"><i class="fa-solid fa-timeline text-primary"></i> <span class="fw-bold">ขั้นตอนด่านรับ (กลุ่มงานบริหารคดีและบริหารทั่วไป)</span></div>
        <div class="card-body">
          <div class="mb-3" id="caStepper"></div>
          <div id="caStageNote" class="small text-muted mb-3"></div>
          <div id="caHistoryBox"></div>
        </div>
      </div>

      <!-- 3. กำหนดเวลาตามกฎหมาย (ด่านรับ) -->
      <div class="card card-ecmis mb-3">
        <div class="card-header"><i class="fa-solid fa-hourglass-half text-primary"></i> <span class="fw-bold">กำหนดเวลาตามกฎหมาย — ชั้นรับเรื่อง</span></div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table tbl-ecmis mb-0 dl-table">
              <thead><tr><th style="width:110px">ฐาน</th><th>รายการ</th><th style="width:190px">กำหนด / วันที่</th></tr></thead>
              <tbody id="deadlineTb"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 4. ฐานอำนาจ / กฎหมายที่เกี่ยวข้อง -->
      <div class="card card-ecmis mb-4">
        <div class="card-header"><i class="fa-solid fa-scale-balanced text-primary"></i> <span class="fw-bold">ฐานอำนาจ / กฎหมายที่เกี่ยวข้อง (งานด่านรับ)</span>
          <span class="ms-2 small text-muted">(พ.ร.บ. มาตรการฝ่ายบริหารฯ แก้ไขถึงฉบับที่ ๔ พ.ศ. ๒๕๖๘)</span>
        </div>
        <div class="card-body" id="lawBox"></div>
      </div>

    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/ecmis-app.js"></script>
  <script src="../assets/ecmis-model.js"></script>
  <script>
    ECMIS.renderShell('case-admin-inbox.html');

    const params = new URLSearchParams(location.search);
    let kase = ECMIS.getCase(params.get('case') || '');

    if (!kase) {
      document.getElementById('notFoundBox').classList.remove('d-none');
    } else {
      document.getElementById('detailWrap').classList.remove('d-none');
      renderDetail();
    }

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

    /* สถานะขั้นด่านรับของ กบค. เทียบกับสำนวน — ต้องแยก 3 กรณีให้ถูก เพราะ
       "ไม่ได้อยู่ในคิวกลั่นกรองตอนนี้และยังไม่มีคณะ" มีได้ทั้ง "ยังไม่ถึงคิวเลย"
       (เช่น ยังรออนุมัติชั้นเลขาธิการฯ ก่อนเข้าชั้นกลั่นกรอง) และ "ผ่านคิวไปนานแล้ว" */
    function caseAdminStage(k) {
      if (ECMIS.caseAdminRouted(k)) return 'done';
      if (ECMIS.isCaseAdminQueue(k)) return 'current';
      const is72 = ECMIS.isCase72(k);
      const stepMap = is72 ? ECMIS.STATUS_STEP_72 : ECMIS.STATUS_STEP;
      const stepsArr = is72 ? ECMIS.FLOW_STEPS_72 : ECMIS.FLOW_STEPS;
      const screenKey = is72 ? 'agenda72' : 'screening';
      const curIdx = stepsArr.findIndex(s => s.key === stepMap[k.status]);
      const screenIdx = stepsArr.findIndex(s => s.key === screenKey);
      if (curIdx === -1) return 'done';
      return curIdx < screenIdx ? 'not-arrived' : 'done';
    }

    function renderDetail() {
      const k = kase;
      document.getElementById('pageTitle').textContent = 'รายละเอียดคดี ' + k.id;
      document.getElementById('headBadges').innerHTML = ECMIS.typeBadge(k) + ' ' + ECMIS.statusBadge(k.status) + ' ' + ECMIS.slaBadge(k);

      const accused = (k.accused || []).map(a => `${esc(a.name || '')}${a.pos ? ' — ' + esc(a.pos) : ''}`).join('<br>') || '—';
      const teamTxt = k.subCommittee
        ? `${esc(k.subCommittee)}${k.routedByCaseAdminAt ? ' · ส่งเมื่อ ' + new Date(k.routedByCaseAdminAt).toLocaleDateString('th-TH') : ''}`
        : '<span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle">— รอส่งเข้าคณะ</span>';
      document.getElementById('headKv').innerHTML = `
        <dt>เลขคดี</dt><dd>${esc(k.id)}</dd>
        <dt>ประเภทเรื่อง</dt><dd>${ECMIS.isCase72(k) ? 'วินิจฉัยชี้มูล' : 'ไต่สวนเบื้องต้น'}</dd>
        <dt>ผู้ถูกกล่าวหา</dt><dd>${accused}</dd>
        <dt>เจ้าของสำนวน</dt><dd>${esc(k.owner || '—')}${k.ownerOrg ? ' · ' + esc(k.ownerOrg) : ''}</dd>
        <dt>เรื่องกล่าวหา</dt><dd>${esc(k.allegation || k.subject || '—')}</dd>
        <dt>เลขรับ / อ้างอิง</dt><dd>${esc(k.docRef || '—')}</dd>
        <dt>วันที่รับเรื่อง</dt><dd>${k.receivedDate ? ECMIS.thaiDate(k.receivedDate) : '—'}</dd>
        <dt>คณะที่มอบหมาย</dt><dd>${teamTxt}</dd>`;

      // actions
      const stage = caseAdminStage(k);
      const acts = document.getElementById('headActions');
      if (stage === 'current') {
        acts.innerHTML = `<button id="btnRoute" class="btn btn-navy btn-sm px-3"><i class="fa-solid fa-share-from-square me-1"></i>ส่งเข้าคณะอนุกลั่นกรองฯ</button>
          <span class="small text-muted">— กระจายสำนวนเข้าคณะที่ ๑–๘ เพื่อพิจารณาให้ความเห็นก่อนบรรจุวาระ</span>`;
        document.getElementById('btnRoute').addEventListener('click', openRouteModal);
      } else if (ECMIS.caseAdminRouted(k)) {
        acts.innerHTML = `<a href="subcommittee-screening.html?case=${encodeURIComponent(k.id)}" class="btn btn-outline-secondary btn-sm px-3"><i class="fa-solid fa-arrow-up-right-from-square me-1"></i>ดูความคืบหน้าที่คณะฯ</a>
          <span class="small text-muted">— สำนวนอยู่ที่ ${esc(k.subCommittee)} · งานด่านรับของกองบริหารคดีเสร็จสิ้นแล้ว</span>`;
      } else if (stage === 'not-arrived') {
        acts.innerHTML = `<span class="small text-muted"><i class="fa-solid fa-circle-info me-1"></i>สำนวนนี้ยังไม่ถึงคิวด่านรับของกองบริหารคดี — อยู่ระหว่างขั้นตอนก่อนหน้า (${esc(k.status)})</span>`;
      } else {
        acts.innerHTML = `<span class="small text-muted"><i class="fa-solid fa-circle-info me-1"></i>สำนวนนี้พ้นชั้นด่านรับ/ชั้นกลั่นกรองแล้ว — อยู่ในความรับผิดชอบของกลุ่มงานอื่น</span>`;
      }

      // stepper 4 ขั้น — ใช้ flow-stepper กลางของระบบ (เหมือน board-resolution.html/chairman-agenda.html)
      const steps = ECMIS.CASE_ADMIN_INTAKE;
      const lastIdx = steps.length - 1;
      document.getElementById('caStepper').innerHTML = `<div class="flow-stepper">` + steps.map((s, i) => {
        let cls = '';
        if (stage === 'current') cls = i < lastIdx ? 'done' : 'active';
        else if (stage === 'done') cls = 'done';
        const mark = cls === 'done' ? '<i class="fa-solid fa-check"></i>' : (i + 1);
        return `<div class="fstep ${cls}"><div class="dot">${mark}</div><div class="lbl">${i + 1}. ${s.label}</div></div>`;
      }).join('') + `</div>`;

      document.getElementById('caStageNote').textContent = stage === 'not-arrived'
        ? 'ยังไม่ถึงคิวด่านรับ — จะแสดงความคืบหน้าเมื่อสำนวนถึงชั้นกลั่นกรอง'
        : '';

      const hist = Array.isArray(k.history) ? k.history.slice().reverse() : [];
      document.getElementById('caHistoryBox').innerHTML = hist.length
        ? '<div class="fw-semibold small mb-2 text-muted">ประวัติการดำเนินการ</div>' + hist.map(h => {
          const d = h.ts ? new Date(h.ts).toLocaleString('th-TH') : '';
          return `<div class="d-flex gap-2 mb-2"><i class="fa-solid fa-circle mt-1" style="font-size:.5rem;color:#0F2A62"></i>
            <div><div class="small"><strong>${esc(h.event || '-')}</strong></div>
            <div class="text-muted" style="font-size:.75rem">${esc(h.actor || '')} · ${d}</div>
            ${h.note ? '<div class="small mt-1">' + esc(h.note) + '</div>' : ''}</div></div>`;
        }).join('')
        : '<div class="text-muted small">ยังไม่มีประวัติการดำเนินการของคดีนี้ในระบบ</div>';

      // 3. deadlines (ชั้นรับเรื่อง)
      const dl = [
        { m: 'ม.๑๘/๑', t: 'เรื่องจาก/ถึง ป.ป.ช. — ส่งเรื่องพร้อมสำนวน + คัดสำเนาเก็บเป็นหลักฐาน', v: 'ภายใน ๑๕ วันนับแต่วันรับเรื่อง/รับแจ้งมติ' },
        { m: 'ม.๑๘/๓', t: 'เรื่องไม่อยู่ในอำนาจ ป.ป.ท. — ส่งคืน ป.ป.ช.', v: 'ภายใน ๑๕ วันนับแต่วันที่ทราบ' },
        { m: 'ม.๒๓', t: 'ต้องเริ่มดำเนินการไต่สวน', v: k.deadline60 ? 'ภายใน ' + ECMIS.thaiDate(k.deadline60) : 'ภายใน ๖๐ วันนับแต่รับเรื่อง' },
        { m: 'ม.๒๘', t: 'เลขาธิการรายงานผลรับ/ไม่รับ/จำหน่ายต่อคณะกรรมการ ป.ป.ท.', v: 'ทุก ๑๕ วัน' }
      ];
      document.getElementById('deadlineTb').innerHTML = dl.map(r =>
        `<tr><td><span class="chip">${r.m}</span></td><td>${esc(r.t)}</td><td>${esc(r.v)}</td></tr>`).join('');

      // 4. law box
      document.getElementById('lawBox').innerHTML = ECMIS.caseAdminLaw().map(e =>
        `<div class="law-row"><span class="chip">${esc(e.m)}</span><span>${esc(e.t)}</span></div>`).join('');
    }

    function openRouteModal() {
      const load = ECMIS.subcommitteeActiveLoad();
      const suggested = ECMIS.nextSubcommitteeTeam();
      const opts = ECMIS.SUBCOMMITTEE_TEAMS.map(t =>
        `<option value="${t}" ${t === suggested ? 'selected' : ''}>${t} — ค้าง ${load[t]} สำนวน${t === suggested ? ' (น้อยสุด)' : ''}</option>`
      ).join('');
      Swal.fire({
        title: 'ส่งเข้าคณะอนุกลั่นกรองฯ',
        html: `<div class="text-start small">
            <div class="mb-2">สำนวน <strong>${kase.id}</strong> — ${ECMIS.isCase72(kase) ? 'วินิจฉัยชี้มูล' : 'ไต่สวนเบื้องต้น'}</div>
            <label class="form-label fw-semibold">เลือกคณะอนุกลั่นกรองฯ</label>
            <select id="swTeam" class="form-select form-select-sm mb-2">${opts}</select>
            <div class="text-muted mb-2">ระบบเสนอ <strong>${suggested}</strong> — คณะที่มีสำนวนค้างระหว่างกลั่นกรองน้อยที่สุด</div>
            <label class="form-label fw-semibold">หมายเหตุ / เหตุผลกรณีเลือกคณะเอง</label>
            <textarea id="swReason" class="form-control form-control-sm" rows="2" placeholder="ระบุเหตุผลหากไม่ใช้คณะที่ระบบเสนอ"></textarea>
          </div>`,
        showCancelButton: true, confirmButtonText: 'ยืนยันส่งเข้าคณะ', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#0F2A62',
        preConfirm: () => {
          const team = document.getElementById('swTeam').value;
          const reason = document.getElementById('swReason').value.trim();
          if (team !== suggested && !reason) { Swal.showValidationMessage('กรุณาระบุเหตุผลเมื่อเลือกคณะที่ไม่ใช่คณะที่ระบบเสนอ'); return false; }
          return { team, reason };
        }
      }).then(res => {
        if (!res.isConfirmed) return;
        const { team, reason } = res.value;
        ECMIS.pushCaseHistory(kase, {
          event: 'ROUTE_TO_SUBCOMMITTEE', from: kase.status, to: kase.status, team,
          note: `กระจายสำนวนเข้า ${team}${team === suggested ? ' (Round-Robin)' : ' (เลือกโดย ผอ.กบค.)'}${reason ? ' — ' + reason : ''}`
        });
        ECMIS.Model.CaseStore.update(kase.id, { subCommittee: team, routedByCaseAdminAt: new Date().toISOString(), history: kase.history });
        kase = ECMIS.getCase(kase.id);
        ECMIS.toastOk(`ส่งสำนวน ${kase.id} เข้า ${team} เรียบร้อย`);
        renderDetail();
      });
    }
  </script>
</body>

</html>
