<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
<link href="assets/ecmis-app.css" rel="stylesheet">
<style>
.btn-xs { font-size: 0.76rem; padding: 0.2rem 0.5rem; border-radius: 4px; }
.col-xl-5col {
  flex: 0 0 100%;
  max-width: 100%;
}
@media (min-width: 576px) {
  .col-xl-5col {
    flex: 0 0 50%;
    max-width: 50%;
  }
}
@media (min-width: 768px) {
  .col-xl-5col {
    flex: 0 0 33.333333%;
    max-width: 33.333333%;
  }
}
@media (min-width: 1200px) {
  .col-xl-5col {
    flex: 0 0 20%;
    max-width: 20%;
  }
}
.kpi-card {
  transition: all 0.2s ease;
  cursor: pointer;
  border-radius: 10px;
  background: #ffffff;
}
.kpi-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(15,42,98,0.12) !important;
}
.kpi-label-2line {
  font-size: .74rem;
  margin-top: 2px;
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
}
.tab-btn { font-weight: 600; font-size: 0.88rem; padding: 0.6rem 1.2rem; border-radius: 8px 8px 0 0; color: #64748b; background: transparent; border: none; border-bottom: 3px solid transparent; transition: all 0.2s; }
.tab-btn:hover { color: #0F2A62; background: rgba(15,42,98,0.03); }
.tab-btn.active { color: #0F2A62; border-bottom-color: #0F2A62; background: #fff; }
</style>
</head>
<body>

<main class="app-main">

  <div class="page-head">
    <div>
      <h1><i class="fa-solid fa-scale-balanced me-2" style="color:#0F2A62"></i>รายการจัดทำมติคณะกรรมการ ป.ป.ท.</h1>
    </div>
    <span class="flow-ref ms-auto"><strong>กลุ่มงานคำวินิจฉัยและมติคณะกรรมการ (กบค.)</strong></span>
  </div>

  <!-- KPI Cards (Bootstrap Row like SecGen) -->
  <div class="row g-3 mb-4" id="kpiRow"></div>

  <!-- Filter & Search Panel -->
  <div class="card card-ecmis mb-4 shadow-sm border-0">
    <div class="card-body p-3">
      <div class="row g-3 align-items-end">
        <div class="col-md-3">
          <label class="form-label fw-semibold text-dark small mb-1">ค้นหาสำนวน แฟ้ม หรือผู้ถูกกล่าวหา</label>
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
            <input type="text" id="searchInput" class="form-control" placeholder="เลขสำนวน, วาระ, ผู้กล่าวหา, ผู้ถูกกล่าวหา, ผู้รับผิดชอบ หรือหน่วยงาน">
          </div>
        </div>
        <div class="col-md-2">
          <label class="form-label fw-semibold text-dark small mb-1"><i class="fa-solid fa-pen-to-square me-1 text-muted"></i>สถานะมติ</label>
          <select id="statusFilter" class="form-select form-select-sm">
            <option value="ALL">ทั้งหมด</option>
            <option value="IN_PROGRESS">อยู่ระหว่างการจัดทำมติ</option>
            <option value="COMPLETED">จัดทำมติแล้วเสร็จ</option>
            <option value="SIGNED">ส่งสำเนามติเพื่อจัดทำคำสั่ง</option>
            <option value="RETURNED">ส่งมติและเอกสารที่เกี่ยวข้องเพื่อทำความเห็นชี้มูล</option>
            <option value="CLOSED">ส่งมติและเอกสารที่เกี่ยวข้องคืนเจ้าของสำนวน/ผู้รับผิดชอบ</option>
            <option value="DISPATCHING">จัดทำรายงานประชุมแล้วเสร็จ</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label fw-semibold text-dark small mb-1"><i class="fa-solid fa-filter me-1 text-muted"></i>ประเภทเรื่อง</label>
          <select id="typeFilter" class="form-select form-select-sm">
            <option value="ALL">ทั้งหมด</option>
            <option value="7.1">ไต่สวนเบื้องต้น</option>
            <option value="7.2">วินิจฉัยชี้มูล</option>
            <option value="7.3">เรื่องทั่วไป</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label fw-semibold text-dark small mb-1"><i class="fa-regular fa-calendar-days me-1 text-muted"></i>ครั้งที่ประชุม</label>
          <select id="meetingFilter" class="form-select form-select-sm">
            <option value="ALL">ทั้งหมด</option>
            <option value="NONE">ยังไม่บรรจุวาระ</option>
          </select>
        </div>
        <div class="col-md-1 text-end">
          <button type="button" class="btn btn-sm btn-outline-secondary py-1 px-3 w-100" id="btnClearFilter">
            <i class="fa-solid fa-rotate-left me-1"></i>ล้างตัวกรอง
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Queue Tabs & Table Panel -->
  <div class="row g-3 align-items-start">
    <div class="col-12">

      <div class="d-flex align-items-center gap-1 border-bottom px-2 mb-0">
        <button type="button" class="tab-btn active" id="tabPending" onclick="switchViewTab('pending')">
          <i class="fa-solid fa-hourglass-half me-1 text-warning"></i>คิวงานรอบันทึกมติ
          <span class="badge bg-danger rounded-pill ms-1" id="badgePendingTab">0</span>
        </button>
        <button type="button" class="tab-btn" id="tabDispatched" onclick="switchViewTab('dispatched')">
          <i class="fa-solid fa-share-nodes me-1 text-primary"></i>ทะเบียนมติและสถานะส่งต่อ
          <span class="badge bg-secondary rounded-pill ms-1" id="badgeDispatchedTab">0</span>
        </button>
      </div>

      <div class="card card-ecmis mb-4 shadow-sm border-0" style="border-top-left-radius:0;">
        <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2 py-2 px-3 bg-white border-bottom">
          <div class="d-flex align-items-center gap-2">
            <i class="fa-solid fa-list-check text-primary"></i>
            <span class="fw-bold" id="card1TitleText">คิวงานรอบันทึกมติคณะกรรมการ ป.ป.ท.</span>
          </div>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover tbl-ecmis mb-0 align-middle">
              <colgroup>
                <col style="width:130px">
                <col style="width:135px">
                <col style="width:120px">
                <col>
                <col style="width:230px">
                <col style="width:120px">
                <col style="width:160px">
              </colgroup>
              <thead>
                <tr>
                  <th>เรื่องที่</th>
                  <th>ประเภทเรื่อง</th>
                  <th>วาระ</th>
                  <th>เรื่องที่กล่าวหา / ผู้รับผิดชอบ</th>
                  <th>สถานะมติ</th>
                  <th>กำหนดเวลา</th>
                  <th class="text-end">ดำเนินการ</th>
                </tr>
              </thead>
              <tbody id="myQueue"></tbody>
            </table>
          </div>

          <div class="px-3 py-2 border-top d-flex align-items-center justify-content-between flex-wrap gap-2 bg-light" id="queueFooter">
            <nav aria-label="Queue navigation" class="ms-auto">
              <ul class="pagination pagination-sm m-0" id="queuePagination"></ul>
            </nav>
          </div>
        </div>

    </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/ecmis-app.js"></script>
<script>
ECMIS.renderShell('resolution-inbox.html');

const role = ECMIS.currentRole();

/* หน้านี้เฉพาะ board_sec เท่านั้น (เจ้าหน้าที่กลุ่มงานคำวินิจฉัยและมติคณะกรรมการ) */
if (role.id !== 'board_sec') { location.href = ECMIS.homeHref(role.id); }

/* ---------- โหลดสำนวนจาก Supabase / Local Data ---------- */
const SUPABASE_URL = 'https://ljhabbwjxnoucrcrsoii.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2Bps-dWMZHz_7cs3BppF6A_ul1_A_xd';
let sb = null;
try {
  if (window.supabase && typeof window.supabase.createClient === 'function') {
    sb = (window.ECMIS && window.ECMIS.getSupabaseClient) ? window.ECMIS.getSupabaseClient(SUPABASE_URL, SUPABASE_KEY) : (window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } }) : null);
  }
} catch (e) {
  console.warn('Supabase init skipped, using local data store:', e);
}

async function loadCasesFromSupabase() {
  if (!sb) return null;
  try {
    const { data, error } = await sb
      .from('tbl_res_request')
      .select('*, tbl_cmp_case(*, tbl_cmp_case_accused(*))')
      .eq('is_deleted', false);
    if (error) throw error;
    return data.map(row => ECMIS.supabaseRowToCase(row)).filter(Boolean);
  } catch (err) {
    console.warn('Supabase fetch failed, falling back to local CASES:', err);
    return null;
  }
}

async function updateCaseStatus(kase, newStatus) {
  const fromStatus = kase.status;
  kase.status = newStatus;
  if (sb && kase.trr_id) {
    const code = ECMIS.STATUS_CODE[newStatus];
    if (code) {
      const { error } = await sb.from('tbl_res_request').update({ trr_status: code }).eq('trr_id', kase.trr_id);
      if (!error) ECMIS.logRequestEvent(kase.trr_id, fromStatus, newStatus);
    }
  }
  ECMIS.saveCases();
}

let currentTab = 'pending'; // 'pending' | 'dispatched'
let CASES = [];
let allCasesCombined = [];
let quickFilter = 'ALL';

function getStage(c) {
  if (c.resolutionStage && typeof c.resolutionStage === 'number') {
    return c.resolutionStage;
  }
  return ECMIS.computeResolutionStage(c);
}

function isRowActionable(c) {
  const stg = getStage(c);
  return stg === 1 || stg === 2;
}

/* ---------- KPI Cards (Clean Text) ---------- */
function renderKPICards() {
  const currentSt = quickFilter;

  const countByStage = {
    ALL: allCasesCombined.length,
    IN_PROGRESS: allCasesCombined.filter(c => getStage(c) === 1).length,
    COMPLETED:   allCasesCombined.filter(c => getStage(c) === 2).length,
    SIGNED:      allCasesCombined.filter(c => getStage(c) === 3).length,
    RETURNED:    allCasesCombined.filter(c => getStage(c) === 4).length,
    CLOSED:      allCasesCombined.filter(c => getStage(c) === 5).length,
    DISPATCHING: allCasesCombined.filter(c => getStage(c) === 6).length
  };

  const kpis = [
    { id:'ALL',         n: countByStage.ALL,         l:'ทั้งหมด',                                           i:'fa-folder-open',      c:'#0F2A62' },
    { id:'IN_PROGRESS', n: countByStage.IN_PROGRESS, l:'อยู่ระหว่างการจัดทำมติ',                            i:'fa-hourglass-half',   c:'#D0A830' },
    { id:'COMPLETED',   n: countByStage.COMPLETED,   l:'จัดทำมติแล้วเสร็จ',                                 i:'fa-circle-check',     c:'#16A34A' },
    { id:'SIGNED',      n: countByStage.SIGNED,      l:'ส่งสำเนามติเพื่อจัดทำคำสั่ง',                       i:'fa-file-signature',   c:'#0284C7' },
    { id:'RETURNED',    n: countByStage.RETURNED,    l:'ส่งมติและเอกสารเพื่อทำความเห็นชี้มูล',             i:'fa-gavel',            c:'#7C3AED' },
    { id:'CLOSED',      n: countByStage.CLOSED,      l:'ส่งมติและเอกสารคืนเจ้าของสำนวน',                   i:'fa-arrow-rotate-left', c:'#64748B' },
    { id:'DISPATCHING', n: countByStage.DISPATCHING, l:'จัดทำรายงานประชุมแล้วเสร็จ',                        i:'fa-clipboard-check',  c:'#059669' }
  ];

  document.getElementById('kpiRow').innerHTML = kpis.map(k => {
    const isActive = (currentSt === k.id);
    return `
    <div class="col-12 col-sm-6 col-md-4 col-xl-5col">
      <div class="card card-ecmis kpi-card h-100 ${isActive ? 'border-2 shadow-sm' : ''}"
           style="min-height:88px; cursor:pointer; ${isActive ? `border-color:${k.c} !important; background:${k.c}0D;` : ''}"
           onclick="filterByKPI('${k.id}')">
        <div class="card-body d-flex align-items-center gap-2 py-3 px-3">
          <div style="flex:0 0 38px;height:38px;border-radius:10px;background:${k.c}18;display:flex;align-items:center;justify-content:center">
            <i class="fa-solid ${k.i}" style="color:${k.c};font-size:1.05rem"></i>
          </div>
          <div style="min-width:0">
            <div style="font-size:1.5rem;font-weight:700;font-family:var(--serif);color:${k.c};line-height:1.1">${k.n}</div>
            <div class="text-muted kpi-label-2line" title="${k.l}">${k.l}</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  // Update tab counts
  const pendingCount = allCasesCombined.filter(c => isRowActionable(c)).length;
  const dispatchedCount = allCasesCombined.filter(c => !isRowActionable(c)).length;
  const bp = document.getElementById('badgePendingTab');
  const bd = document.getElementById('badgeDispatchedTab');
  if (bp) bp.textContent = pendingCount;
  if (bd) bd.textContent = dispatchedCount;

  /* เลขบนแถบเมนูด้านข้าง (badge สีแดง) มาจาก ECMIS.inboxFor('board_sec') ซึ่งอิง CASES จำลอง
     ส่วนกลาง ไม่ใช่ข้อมูลจริงจาก Supabase ที่โหลดในหน้านี้ — sync ให้ตรงกับคิวงานรอบันทึกมติจริง
     (pendingCount) เช่นเดียวกับรูปแบบที่ inbox.html ใช้กับ badge ของ role อื่น ๆ */
  const navBadge = document.querySelector('#appSidebar .badge.bg-danger.rounded-pill');
  if (navBadge) {
    if (pendingCount) navBadge.textContent = pendingCount;
    else navBadge.remove();
  }
}

function filterByKPI(statusId) {
  quickFilter = statusId;
  const sf = document.getElementById('statusFilter');
  if (sf) sf.value = statusId;

  // Smart Tab Switching
  if (statusId === 'IN_PROGRESS' || statusId === 'COMPLETED') {
    switchViewTab('pending', false);
  } else if (['SIGNED', 'RETURNED', 'CLOSED', 'DISPATCHING'].includes(statusId)) {
    switchViewTab('dispatched', false);
  }
  applyFilters();
}

function switchViewTab(tab, resetFilter = true) {
  currentTab = tab;
  document.getElementById('tabPending').classList.toggle('active', tab === 'pending');
  document.getElementById('tabDispatched').classList.toggle('active', tab === 'dispatched');

  const titleEl = document.getElementById('card1TitleText');

  if (tab === 'pending') {
    if (titleEl) titleEl.textContent = 'คิวงานรอบันทึกมติคณะกรรมการ ป.ป.ท.';
  } else {
    if (titleEl) titleEl.textContent = 'ทะเบียนมติและสถานะส่งต่อ';
  }

  if (resetFilter) {
    quickFilter = 'ALL';
    const sf = document.getElementById('statusFilter');
    if (sf) sf.value = 'ALL';
  }

  applyFilters();
}

let currentPage = 1;
const pageSize = 10;
function caseIdSortValue(id) {
  const m = /^(\d+)\/(\d+)$/.exec(id || '');
  if (!m) return 0;
  return parseInt(m[2], 10) * 100000 + parseInt(m[1], 10);
}

/* เรียง "4.1.1" < "4.1.2" < "4.1.3" < "5.1.1" ตามค่าตัวเลขแต่ละส่วนที่คั่นด้วยจุด
   ไม่ใช่เรียงแบบ string (ซึ่งจะทำให้ "4.1.10" มาก่อน "4.1.2" ผิดธรรมชาติ) */
function agendaNoSortValue(agendaNo) {
  return String(agendaNo || '').split('.').map(s => parseInt(s, 10) || 0);
}
function compareAgendaNo(a, b) {
  const pa = agendaNoSortValue(a), pb = agendaNoSortValue(b);
  const len = Math.max(pa.length, pb.length);
  for (let i = 0; i < len; i++) {
    const diff = (pa[i] || 0) - (pb[i] || 0);
    if (diff !== 0) return diff;
  }
  return 0;
}

function getActionBadge(c) {
  const stg = getStage(c);
  if (stg === 1) {
    return '<span class="st st-pending"><i class="fa-solid fa-hourglass-half me-1"></i>อยู่ระหว่างการจัดทำมติ</span>';
  }
  if (stg === 2) {
    return '<span class="st st-done"><i class="fa-solid fa-circle-check me-1"></i>จัดทำมติแล้วเสร็จ</span>';
  }
  if (stg === 3) {
    return '<span class="st st-stage-3" style="background:#E0F2FE;color:#0369A1;border:1px solid #BAE6FD"><i class="fa-solid fa-file-signature me-1"></i>ส่งสำเนามติเพื่อจัดทำคำสั่ง</span>';
  }
  if (stg === 4) {
    return '<span class="st st-stage-4" style="background:#F3E8FF;color:#7E22CE;border:1px solid #E9D5FF"><i class="fa-solid fa-gavel me-1"></i>ส่งมติและเอกสารที่เกี่ยวข้องเพื่อทำความเห็นชี้มูล</span>';
  }
  if (stg === 5) {
    return '<span class="st st-stage-5" style="background:#F1F5F9;color:#475569;border:1px solid #CBD5E1"><i class="fa-solid fa-arrow-rotate-left me-1"></i>ส่งมติและเอกสารที่เกี่ยวข้องคืนเจ้าของสำนวน/ผู้รับผิดชอบ</span>';
  }
  if (stg === 6) {
    return '<span class="st st-stage-6" style="background:#ECFDF5;color:#047857;border:1px solid #A7F3D0"><i class="fa-solid fa-clipboard-check me-1"></i>จัดทำรายงานประชุมแล้วเสร็จ</span>';
  }
  return ECMIS.resolutionStageBadge(stg);
}

/* ป้ายประเภทเรื่อง (Clean Text) */
function typeBadge(c, is72){
  return ECMIS.typeBadge(c, is72);
}

function agendaCell(c){
  if (!c.agendaNo) return '<span class="text-muted">-</span>';
  return `<span class="small">วาระ ${c.agendaNo}</span>`;
}

function meetingGroupKey(c){ return c.meetingNo || 'NONE'; }
function meetingGroupLabel(key){ return key === 'NONE' ? 'ยังไม่บรรจุวาระ' : `ครั้งที่ ${key}`; }

function groupHeaderRow(key, continued){
  return `<tr class="meeting-group-row">
    <td colspan="7" class="py-2 px-3" style="background:#EEF2F8;border-top:2px solid #0F2A62;border-bottom:1px solid #D8DEE9;">
      <span class="fw-bold text-navy" style="color:#0F2A62">
        <i class="fa-regular fa-calendar-days me-2"></i>${meetingGroupLabel(key)}${continued ? ' <span class="text-muted fw-normal">(ต่อ)</span>' : ''}
      </span>
    </td>
  </tr>`;
}

function row(c){
  const is72 = ECMIS.isCase72(c);
  const stg = getStage(c);
  const isActionable = isRowActionable(c);
  
  const target = is72
    ? `resolution-72.html?case=${encodeURIComponent(c.id)}`
    : `board-resolution.html?case=${encodeURIComponent(c.id)}`;

  const statusBadgeHtml = getActionBadge(c);

  return `<tr>
    <td class="case-no">${c.id}${(c.urgent || c.urgent72)?' <span class="st st-urgent ms-1">ด่วน</span>':''}</td>
    <td>${typeBadge(c, is72)}</td>
    <td>${agendaCell(c)}</td>
    <td style="max-width:320px">
      <div class="text-truncate fw-medium" title="${c.subject}">${c.subject}</div>
      <small class="text-muted d-block" style="font-size:0.75rem">
        <i class="fa-regular fa-building me-1"></i>${c.ownerOrg} · <i class="fa-regular fa-user me-1"></i>${c.owner || 'เจ้าของสำนวน'}
      </small>
    </td>
    <td>${statusBadgeHtml}</td>
    <td>${ECMIS.slaBadge(c)}</td>
    <td class="text-end">
      ${isActionable ? `
        <a href="${target}" class="btn btn-sm btn-navy px-3 py-1 shadow-sm" style="font-size:0.8rem; white-space:nowrap;">
          <i class="fa-solid fa-pen-to-square me-1"></i>บันทึกมติ
        </a>
      ` : `
        <a href="${target}" class="btn btn-sm btn-outline-secondary px-3 py-1" style="font-size:0.8rem; white-space:nowrap;">
          <i class="fa-solid fa-eye me-1"></i>ดูมติที่ส่งต่อ
        </a>
      `}
    </td>
  </tr>`;
}

let filteredCombined = [];

function renderMyQueue(loading = false) {
  const tbodyPrimary = document.getElementById('myQueue');

  if (loading) {
    let skeletons = '';
    for(let i=0; i<Math.min(pageSize, filteredCombined.length || 3); i++) {
      skeletons += `
        <tr class="skeleton-row">
          <td><div class="skeleton-box" style="width:80px"></div></td>
          <td><div class="skeleton-box" style="width:100px"></div></td>
          <td><div class="skeleton-box" style="width:90px"></div></td>
          <td><div class="skeleton-box" style="width:200px"></div></td>
          <td><div class="skeleton-box" style="width:110px"></div></td>
          <td><div class="skeleton-box" style="width:80px"></div></td>
          <td class="text-end"><div class="skeleton-box ms-auto" style="width:80px"></div></td>
        </tr>`;
    }
    tbodyPrimary.innerHTML = skeletons;

    setTimeout(() => {
      renderMyQueue(false);
    }, 200);
    return;
  }

  // เรียงตามวาระจากน้อยไปมากเสมอ (4.1.1 < 4.1.2 < 4.1.3 < 5.1.1); เคสไม่มีวาระ (null)
  // เรียงตามเลขสำนวนแทน
  function sortByField(list) {
    return [...list].sort((a, b) => {
      if (a.agendaNo && b.agendaNo) return compareAgendaNo(a.agendaNo, b.agendaNo);
      if (a.agendaNo && !b.agendaNo) return -1;
      if (!a.agendaNo && b.agendaNo) return 1;
      return caseIdSortValue(a.id) - caseIdSortValue(b.id);
    });
  }

  // จัดกลุ่มตามครั้งที่ประชุม: เรียงกลุ่มใหม่->เก่า, "ยังไม่บรรจุวาระ" ไว้ท้ายสุด, เรียงตามวาระทำงานภายในแต่ละกลุ่ม
  const groups = new Map();
  filteredCombined.forEach(c => {
    const key = meetingGroupKey(c);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(c);
  });
  const groupKeys = [...groups.keys()].sort((a, b) => {
    if (a === 'NONE') return 1;
    if (b === 'NONE') return -1;
    return caseIdSortValue(b) - caseIdSortValue(a);
  });

  const sortedCases = [];
  const groupKeyForIndex = [];
  groupKeys.forEach(key => {
    sortByField(groups.get(key)).forEach(c => {
      sortedCases.push(c);
      groupKeyForIndex.push(key);
    });
  });

  const totalItems = sortedCases.length;
  const totalPages = Math.ceil(totalItems / pageSize) || 1;
  if (currentPage > totalPages) currentPage = totalPages;
  const startIdx = (currentPage - 1) * pageSize;
  const paginatedCases = sortedCases.slice(startIdx, startIdx + pageSize);
  const paginatedKeys = groupKeyForIndex.slice(startIdx, startIdx + pageSize);

  if (!paginatedCases.length) {
    tbodyPrimary.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">
         <i class="fa-solid fa-folder-open fa-2x mb-2 d-block text-primary"></i>
         ไม่มีรายการสำนวนในมุมมองนี้ตามเงื่อนไขที่ค้นหา<br>
         <small>ลองเลือกแท็บมุมมองอื่น หรือเลือกตัวกรองสถานะเป็น "ทั้งหมด"</small></td></tr>`;
  } else {
    let html = '';
    paginatedKeys.forEach((key, i) => {
      const isNewGroup = i === 0 || key !== paginatedKeys[i - 1];
      if (isNewGroup) {
        const continued = i === 0 && startIdx > 0 && groupKeyForIndex[startIdx - 1] === key;
        html += groupHeaderRow(key, continued);
      }
      html += row(paginatedCases[i]);
    });
    tbodyPrimary.innerHTML = html;
  }


  const paginUl = document.getElementById('queuePagination');
  let paginHtml = `
    <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
      <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">«</a>
    </li>`;
  for (let i = 1; i <= totalPages; i++) {
    paginHtml += `
      <li class="page-item ${currentPage === i ? 'active' : ''}">
        <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
      </li>`;
  }
  paginHtml += `
    <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
      <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">»</a>
    </li>`;
  paginUl.innerHTML = paginHtml;
}

function changePage(p) {
  currentPage = p;
  renderMyQueue(true);
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const st = document.getElementById('statusFilter').value;
  const typ = document.getElementById('typeFilter')?.value || 'ALL';
  const mtg = document.getElementById('meetingFilter')?.value || 'ALL';

  filteredCombined = allCasesCombined.filter(c => {
    const is72 = ECMIS.isCase72(c);
    const is73 = ECMIS.isCase73(c);
    const stage = getStage(c);
    const isActionable = isRowActionable(c);

    // Tab filter matching
    if (currentTab === 'pending' && !isActionable) return false;
    if (currentTab === 'dispatched' && isActionable) return false;

    // Search query match
    const matchQ = !q ||
      c.id.toLowerCase().includes(q) ||
      (c.subject && c.subject.toLowerCase().includes(q)) ||
      (c.ownerOrg && c.ownerOrg.toLowerCase().includes(q)) ||
      (c.owner && c.owner.toLowerCase().includes(q)) ||
      (c.complainant && c.complainant.toLowerCase().includes(q)) ||
      (Array.isArray(c.accused) && c.accused.some(p =>
        (p.name && p.name.toLowerCase().includes(q)) ||
        (p.idcard && p.idcard.toLowerCase().includes(q))
      )) ||
      (c.agendaNo && c.agendaNo.toLowerCase().includes(q));

    // Status filter match (Stage 1 to 6)
    let matchSt = true;
    if (st !== 'ALL') {
      if (st === 'IN_PROGRESS') matchSt = (stage === 1);
      else if (st === 'COMPLETED') matchSt = (stage === 2);
      else if (st === 'SIGNED') matchSt = (stage === 3);
      else if (st === 'RETURNED') matchSt = (stage === 4);
      else if (st === 'CLOSED') matchSt = (stage === 5);
      else if (st === 'DISPATCHING') matchSt = (stage === 6);
      else matchSt = (c.status === st);
    }

    // Type filter match
    let matchType = true;
    if (typ === '7.1') matchType = (!is72 && !is73);
    else if (typ === '7.2') matchType = is72;
    else if (typ === '7.3') matchType = is73;

    // Meeting filter match
    let matchMeeting = true;
    if (mtg === 'NONE') matchMeeting = !c.meetingNo;
    else if (mtg !== 'ALL') matchMeeting = (c.meetingNo === mtg);

    return matchQ && matchSt && matchType && matchMeeting;
  });

  currentPage = 1;
  renderKPICards();
  renderMyQueue(true);
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('statusFilter').addEventListener('change', (e) => {
  quickFilter = e.target.value;
  if (['IN_PROGRESS', 'COMPLETED'].includes(quickFilter)) {
    switchViewTab('pending', false);
  } else if (['SIGNED', 'RETURNED', 'CLOSED', 'DISPATCHING'].includes(quickFilter)) {
    switchViewTab('dispatched', false);
  }
  applyFilters();
});
document.getElementById('typeFilter')?.addEventListener('change', applyFilters);
document.getElementById('meetingFilter')?.addEventListener('change', applyFilters);
document.getElementById('btnClearFilter').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  document.getElementById('statusFilter').value = 'ALL';
  if (document.getElementById('typeFilter')) document.getElementById('typeFilter').value = 'ALL';
  if (document.getElementById('meetingFilter')) document.getElementById('meetingFilter').value = 'ALL';
  quickFilter = 'ALL';
  applyFilters();
});

function populateMeetingFilter() {
  const sel = document.getElementById('meetingFilter');
  if (!sel) return;
  const meetingNos = [...new Set(allCasesCombined.map(c => c.meetingNo).filter(Boolean))]
    .sort((a, b) => caseIdSortValue(b) - caseIdSortValue(a));
  const extra = meetingNos.map(m => `<option value="${m}">${m}</option>`).join('');
  sel.insertAdjacentHTML('beforeend', extra);
}

(async function main() {
  try {
    const live = await loadCasesFromSupabase();
    CASES = (live && live.length) ? live : ECMIS.CASES.slice();
  } catch (err) {
    console.error('โหลดข้อมูลไม่สำเร็จ:', err);
    CASES = ECMIS.CASES.slice();
  }
  
  // Scope รวมทุกสำนวนในสายงานมติ (Stage 1 ถึง 6)
  const RESOLUTION_SCOPE_STATUSES = [
    'AGENDA_SET', 'IN_MEETING', 'PENDING_INVITE_72', 'IN_MEETING_72', 
    'RESOLVED_PENDING', 'RESOLVED', 'RESOLVED_PENDING_72', 'PENDING_DISPATCH_GUILTY_72', 'DISPATCHING', 'CLOSED'
  ];
  allCasesCombined = CASES.filter(c => RESOLUTION_SCOPE_STATUSES.includes(c.status) && ECMIS.canViewCase(c, role.id));
  filteredCombined = [...allCasesCombined];

  populateMeetingFilter();
  renderKPICards();
  switchViewTab('pending');
})();

</script>
