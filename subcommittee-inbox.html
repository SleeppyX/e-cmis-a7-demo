<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายการสำนวนรอกลั่นกรอง | คณะอนุกรรมการกลั่นกรองฯ | E-CMIS</title>
  <link rel="icon" type="image/png" href="assets/pacc_logo.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="assets/ecmis-app.css" rel="stylesheet">
  <link href="assets/a4-ecmis-workspace.css" rel="stylesheet">
  <style>
    .kpi-card {
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .kpi-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(15, 42, 98, 0.12);
    }
  </style>
</head>

<body>

  <main class="app-main">

    <div class="page-head d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
      <div>
        <h1><i class="fa-solid fa-users-viewfinder me-2" style="color:#0F2A62"></i><span>รายการสำนวนรอกลั่นกรอง</span></h1>
      </div>
      <div class="d-flex align-items-center gap-3 ms-auto">
        <span class="flow-ref">คณะอนุกรรมการกลั่นกรองฯ พิจารณาสำนวน 7.1/7.2 ตามคณะที่ได้รับมอบหมาย</span>
      </div>
    </div>

    <!-- KPI Cards Row -->
    <div class="row g-3 mb-4" id="kpiRow"></div>

    <!-- Filter Bar -->
    <div class="card card-ecmis mb-4">
      <div class="card-body p-3">
        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label class="form-label fw-semibold text-dark small mb-1">ค้นหางาน แฟ้ม หรือผู้ถูกกล่าวหา</label>
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
              <input type="text" id="searchInput" class="form-control"
                placeholder="เลขสำนวน, เรื่อง, ผู้ถูกกล่าวหา, ผู้รับผิดชอบ">
            </div>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold text-dark small mb-1"><i
                class="fa-solid fa-pen-to-square me-1 text-muted"></i>ประเภทสำนวน</label>
            <select id="typeFilter" class="form-select form-select-sm">
              <option value="ALL">ทั้งหมด</option>
              <option value="7.1">7.1 ไต่สวนเบื้องต้น</option>
              <option value="7.2">7.2 วินิจฉัยชี้มูล</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold text-dark small mb-1"><i
                class="fa-solid fa-list-check me-1 text-muted"></i>สถานะกลั่นกรอง</label>
            <select id="statusFilter" class="form-select form-select-sm">
              <option value="ALL">ทั้งหมด</option>
              <option value="PENDING">รอกลั่นกรอง</option>
              <option value="MORE_INFO">รอข้อมูลเพิ่มเติม</option>
              <option value="RETURNED">ส่งคืนเจ้าของสำนวน</option>
              <option value="DONE">กลั่นกรองแล้วเสร็จ</option>
            </select>
          </div>
          <div class="col-md-2 text-end">
            <button type="button" class="btn btn-sm btn-outline-secondary py-1 px-3 w-100" id="btnClearFilter">
              <i class="fa-solid fa-rotate-left me-1"></i>ล้างตัวกรอง
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Table Queue List -->
    <div class="row g-3 align-items-start">
      <div class="col-12">

        <div class="card card-ecmis mb-4">
          <div class="card-header d-flex align-items-center flex-wrap gap-2">
            <i class="fa-solid fa-list-check text-primary"></i>
            <span class="fw-bold">รายการสำนวนในคิวกลั่นกรอง</span>
            <span class="ms-auto small text-muted" id="myRoleLabel">บทบาท: คณะอนุกรรมการกลั่นกรองฯ</span>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover tbl-ecmis mb-0 align-middle">
                <colgroup>
                  <col style="width:140px">
                  <col style="width:150px">
                  <col>
                  <col style="width:150px">
                  <col style="width:150px">
                  <col style="width:140px">
                </colgroup>
                <thead>
                  <tr>
                    <th class="sortable-header" data-sort="id" style="cursor:pointer">เรื่องที่ <i
                        class="fa-solid fa-sort-down ms-1" style="font-size:0.75rem"></i></th>
                    <th>ประเภทเรื่อง</th>
                    <th>เรื่องกล่าวหา</th>
                    <th>สถานะกลั่นกรอง</th>
                    <th class="sortable-header" data-sort="slaDays" style="cursor:pointer">กำหนดเวลา <i
                        class="fa-solid fa-sort ms-1" style="font-size:0.75rem"></i></th>
                    <th class="text-end">ดำเนินการ</th>
                  </tr>
                </thead>
                <tbody id="myQueue"></tbody>
              </table>
            </div>

            <div class="px-3 py-2 border-top d-flex align-items-center justify-content-between flex-wrap gap-2">
              <div class="small text-muted ms-auto" id="tableSummaryText">แสดง 0 ถึง 0 จาก 0 รายการ</div>
            </div>
          </div>
        </div>

      </div>
    </div>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/ecmis-app.js"></script>
  <script>
    ECMIS.renderShell('subcommittee-inbox.html');

    const role = ECMIS.currentRole();
    const selectedTeam = ECMIS.currentSubTeam();
    $('#myRoleLabel').text(`บทบาท: คณะอนุกรรมการกลั่นกรองฯ — ${selectedTeam}`);

    let sortField = 'id';
    let sortOrder = 'asc';

    /* ---------- โหลดสำนวนจาก Supabase / Local Data (เดียวกับ case-admin-inbox.html) ---------- */
    let sb = null;
    try { sb = window.ECMIS && window.ECMIS.getSupabaseClient ? window.ECMIS.getSupabaseClient() : null; }
    catch (e) { console.warn('Supabase init skipped, using local data store:', e); }

    async function loadCasesFromSupabase() {
      if (!sb) return null;
      try {
        const { data, error } = await sb
          .from('tbl_res_request')
          .select('*, tbl_cmp_case(*, tbl_cmp_case_accused(*))')
          .eq('is_deleted', false);
        if (error) throw error;
        return data.map(row => ECMIS.supabaseRowToCase(row)).filter(Boolean);
      } catch (err) {
        console.warn('Supabase fetch failed, falling back to local CASES:', err);
        return null;
      }
    }

    let CASES = ECMIS.CASES.slice();
    let teamCases = [];

    /* คิวของคณะที่เลือก: สำนวนที่ subCommittee ตรงกับคณะที่กำลังดูอยู่ —
       รวมสถานะ รอกลั่นกรอง (IN_SCREENING/_72), รอข้อมูลเพิ่มเติม (SCREENING_MORE_INFO/_72)
       และ ส่งคืน/กลั่นกรองเสร็จ (RETURNED/_72, AGENDA_SET, PENDING_INVITE_72) เฉพาะที่มี subOutcome
       บันทึกไว้แล้ว เพื่อให้แถวยังค้างอยู่ในแท็บของตัวเอง (audit trail) */
    const ACTIVE_SCREEN = ['IN_SCREENING', 'IN_SCREENING_72', 'SCREENING_MORE_INFO', 'SCREENING_MORE_INFO_72'];
    const CARRIED_SCREEN = ['RETURNED', 'RETURNED_72', 'AGENDA_SET', 'PENDING_INVITE_72'];
    function computeTeamCases() {
      teamCases = CASES.filter(c =>
        c.subCommittee === selectedTeam &&
        (ACTIVE_SCREEN.includes(c.status) || (CARRIED_SCREEN.includes(c.status) && c.subOutcome))
      ).map(c => {
        const om = ECMIS.mapSubOutcome(c.subOutcome);
        return {
          id: c.id,
          subject: c.subject,
          allegation: c.allegation,
          procType: ECMIS.isCase72(c) ? '7.2' : '7.1',
          owner: c.owner,
          ownerOrg: c.ownerOrg,
          slaLimit: c.slaLimit,
          slaEff: ECMIS.slaEffectiveDays(c),
          slaDays: ECMIS.slaEffectiveDays(c),
          onHold: ECMIS.slaIsOnHold(c),
          screenStatus: ECMIS.subScreeningStatus(c),
          outcomeLabel: om ? om.label : null,
          outcomeLawRef: om ? om.lawRef : null,
          accused: c.accused || []
        };
      });
    }
    computeTeamCases();

    const SCREEN_META = ECMIS.SUB_SCREENING_STATUS;

    function renderKPI() {
      const cnt = k => teamCases.filter(c => c.screenStatus === k).length;
      const kpis = [
        { key: 'ALL', n: teamCases.length, l: 'สำนวนทั้งหมดในคิว', i: 'fa-folder-open', c: '#0F2A62' },
        { key: 'PENDING', n: cnt('PENDING'), l: 'รอกลั่นกรอง', i: 'fa-hourglass-half', c: '#D0A830' },
        { key: 'MORE_INFO', n: cnt('MORE_INFO'), l: 'รอข้อมูลเพิ่มเติม', i: 'fa-circle-question', c: '#0284C7' },
        { key: 'RETURNED', n: cnt('RETURNED'), l: 'ส่งคืนเจ้าของสำนวน', i: 'fa-rotate-left', c: '#B91C1C' },
        { key: 'DONE', n: cnt('DONE'), l: 'กลั่นกรองแล้วเสร็จ', i: 'fa-circle-check', c: '#15803D' }
      ];

      document.getElementById('kpiRow').innerHTML = kpis.map(k => `
        <div class="col">
          <div class="card card-ecmis kpi-card h-100" data-kpi="${k.key}">
            <div class="card-body p-3 d-flex align-items-center justify-content-between">
              <div>
                <div class="text-muted small mb-1">${k.l}</div>
                <div class="h3 fw-bold mb-0" style="color:${k.c}">${k.n}</div>
              </div>
              <div class="rounded-circle p-3 d-flex align-items-center justify-content-center"
                   style="background: ${k.c}15; width:48px; height:48px;">
                <i class="fa-solid ${k.i} fs-5" style="color:${k.c}"></i>
              </div>
            </div>
          </div>
        </div>
      `).join('');

      $('#kpiRow .kpi-card').on('click', function () {
        const key = $(this).data('kpi');
        $('#statusFilter').val(key === 'ALL' ? 'ALL' : key);
        renderQueue();
      });
    }

    function renderQueue() {
      const q = ($('#searchInput').val() || '').trim().toLowerCase();
      const type = $('#typeFilter').val() || 'ALL';
      const status = $('#statusFilter').val() || 'ALL';

      let filtered = teamCases.filter(c => {
        if (type !== 'ALL' && c.procType !== type) return false;
        if (status !== 'ALL' && c.screenStatus !== status) return false;
        if (!q) return true;
        const matchSubject = c.subject && c.subject.toLowerCase().includes(q);
        const matchId = c.id && c.id.toLowerCase().includes(q);
        const matchOwner = c.owner && c.owner.toLowerCase().includes(q);
        const matchAccused = c.accused && c.accused.some(a => a.name && a.name.toLowerCase().includes(q));
        return matchSubject || matchId || matchOwner || matchAccused;
      });

      filtered.sort((a, b) => {
        let valA = a[sortField], valB = b[sortField];
        if (typeof valA === 'string') {
          return sortOrder === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
        }
        return sortOrder === 'asc' ? (valA - valB) : (valB - valA);
      });

      $('#tableSummaryText').text(`แสดง 1 ถึง ${filtered.length} จาก ${filtered.length} รายการ`);

      if (filtered.length === 0) {
        $('#myQueue').html(`
          <tr>
            <td colspan="6" class="text-center py-4 text-muted">
              <i class="fa-solid fa-folder-open fa-2x mb-2 d-block text-secondary"></i>
              ไม่พบสำนวนในคิวของ ${selectedTeam} ตามเงื่อนไขที่เลือก
            </td>
          </tr>
        `);
        return;
      }

      const html = filtered.map(c => {
        // badge "ประเภทเรื่อง" — ใช้ helper กลางให้ตรงกับ inbox.html / resolution-inbox.html
        const typeBadge = ECMIS.typeBadge(c, c.procType === '7.2');

        const sm = SCREEN_META[c.screenStatus] || SCREEN_META.PENDING;
        const outcomeHint = c.outcomeLabel
          ? `<small class="text-muted d-block text-truncate" style="font-size:0.7rem" title="${c.outcomeLabel} · ${c.outcomeLawRef || ''}">${c.outcomeLabel}</small>`
          : '';
        const statusBadge = `<span class="meet-badge ${sm.badge}">${sm.label}</span>${outcomeHint}`;

        const slaBadge = c.onHold
          ? `<span class="sla sla-warn"><i class="fa-solid fa-pause me-1"></i>รอข้อมูล (${c.slaEff}/${c.slaLimit} วัน)</span>`
          : (c.slaEff >= 10
            ? `<span class="sla sla-warn"><i class="fa-solid fa-clock me-1"></i>ใช้ไป ${c.slaEff}/${c.slaLimit} วัน</span>`
            : `<span class="sla sla-ok"><i class="fa-solid fa-clock me-1"></i>ใช้ไป ${c.slaEff}/${c.slaLimit} วัน</span>`);

        const page = 'subcommittee-screening.html';
        const done = c.screenStatus === 'DONE' || c.screenStatus === 'RETURNED';

        return `
          <tr>
            <td class="case-no">${c.id}</td>
            <td>${typeBadge}</td>
            <td style="max-width:360px">
              <div class="text-truncate fw-medium" title="${c.subject}">${c.subject}</div>
              <small class="text-muted d-block text-truncate" style="font-size:0.75rem">${c.ownerOrg || ''}</small>
            </td>
            <td>${statusBadge}</td>
            <td>${slaBadge}</td>
            <td class="text-end">
              <a href="${page}?case=${encodeURIComponent(c.id)}" class="btn btn-sm ${done ? 'btn-outline-secondary' : 'btn-navy'} px-3">
                <i class="fa-solid ${done ? 'fa-eye' : 'fa-pen-to-square'} me-1"></i>${done ? 'ดูรายละเอียด' : 'ดำเนินการ'}
              </a>
            </td>
          </tr>
        `;
      }).join('');

      $('#myQueue').html(html);
    }

    $(document).ready(function () {
      renderKPI();
      renderQueue();

      (async function refreshFromSupabase() {
        const live = await loadCasesFromSupabase();
        if (live && live.length) {
          CASES = live;
          computeTeamCases();
          renderKPI();
          renderQueue();
        }
      })();

      $('#searchInput').on('input', renderQueue);
      $('#typeFilter').on('change', renderQueue);
      $('#statusFilter').on('change', renderQueue);
      $('#btnClearFilter').on('click', function () {
        $('#searchInput').val('');
        $('#typeFilter').val('ALL');
        $('#statusFilter').val('ALL');
        renderQueue();
      });

      $('.sortable-header').on('click', function () {
        const field = $(this).data('sort');
        if (sortField === field) {
          sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
        } else {
          sortField = field;
          sortOrder = 'asc';
        }
        $('.sortable-header i').attr('class', 'fa-solid fa-sort ms-1');
        $(this).find('i').attr('class', `fa-solid fa-sort-${sortOrder === 'asc' ? 'up' : 'down'} ms-1`);
        renderQueue();
      });
    });
  </script>
</body>

</html>
