      $('#myRoleLabel').text(`บทบาท: คณะอนุกรรมการสนับสนุนเลขาธิการฯ — ${groupLabel}`);

      // Filter cases mapped to the selected group
      currentCases = allCases.filter(c => c.assignedGroup === selectedGroup);

      renderKPI();
      renderQueue();
    }

    async function refreshFromSupabase() {
      if (!sb) return;
      try {
        const { data, error } = await sb
          .from('tbl_res_request')
          .select('*, tbl_cmp_case!inner(*, tbl_cmp_case_accused(*))')
          .eq('is_deleted', false)
          .order('created_datetime', { ascending: false });
        if (error) throw error;
        if (!data || data.length === 0) return;

        const liveCases = [];
        data.forEach((row, idx) => {
          const c = ECMIS.supabaseRowToCase(row);
          if (!c || !c.id || c.id.startsWith('TEST-')) return;

          /* คณะอนุกรรมการสนับสนุนเลขาธิการฯ ที่เลขาธิการฯ มอบหมายไว้ — เก็บใน resolutionData.subCommittee
             (ไม่ใช้ c.subCommittee ตรงๆ เพราะ field นั้นเป็นของคณะอนุกลั่นกรองฯ 1-8 ที่กองบริหารคดีเป็นคนตั้งค่า
             คนละความหมายกัน แต่เคยใช้ชื่อ field ชนกัน) */
          const supportTeam = c.supportSubTeam || (c.resolutionData && c.resolutionData.supportSubTeam) || '';
          const isSubStatus = (
            c.status === 'IN_SUPPORT_SUB' || c.status === 'IN_SUPPORT_SUB_72' ||
            c.status === 'RETURNED' || c.status === 'RETURNED_72' ||
            c.status === 'PENDING_CHAIRMAN' || c.status === 'PENDING_INVITE_72' ||
            c.status === 'PENDING_URGENT' || c.status === 'PENDING_URGENT_72' ||
            c.status === 'AGENDA_SET' || c.status === 'PENDING_SUBCOMMITTEE' || supportTeam
          );
          if (!isSubStatus) return;

          let statusCat = 'PENDING';
          let statusText = 'รอกลั่นกรอง';
          if (c.status === 'IN_SUPPORT_SUB' || c.status === 'IN_SUPPORT_SUB_72' || c.status === 'PENDING_SUBCOMMITTEE') {
            statusCat = 'PENDING';
            statusText = 'รอกลั่นกรอง';
          } else if (c.status === 'RETURNED' || c.status === 'RETURNED_72') {
            statusCat = 'RETURNED';
            statusText = 'ส่งคืนต้นทาง (กจ.5)';
          } else if (['PENDING_CHAIRMAN', 'PENDING_INVITE_72', 'PENDING_URGENT', 'PENDING_URGENT_72', 'AGENDA_SET', 'RESOLVED'].includes(c.status) ||
                     ((c.status === 'PENDING_SECGEN' || c.status === 'PENDING_SECGEN_72') && (c.supportOpinion || c.supportOpinion72 || c.supportDecision))) {
            statusCat = 'DONE';
            statusText = 'กลั่นกรองแล้วเสร็จ (ส่งคืนเลขาฯ แล้ว)';
          }

          const isGroup2 = supportTeam.includes('2') ? true : (supportTeam.includes('1') ? false : (idx % 2 === 1));
          const assignedGroup = isGroup2 ? 'group2' : 'group1';
          const team = isGroup2 ? 'TEAM2' : 'TEAM1';
          const teamLabel = isGroup2 ? 'คณะที่ 2' : 'คณะที่ 1';

          const isComplex = c.isComplex || supportTeam.length > 0 || (c.resolutionData && c.resolutionData.code === 'ACCEPT_S24P3');
          const triggerType = (statusCat === 'RETURNED') ? 'RETURN' : (statusCat === 'DONE' ? 'DONE' : (isComplex ? 'COMPLEX' : 'DIFFER'));
          const triggerBadgeText = (statusCat === 'RETURNED') ? 'ส่งคืนสายงานต้นทาง' : (statusCat === 'DONE' ? 'กลั่นกรองแล้วเสร็จ' : (isComplex ? 'ประเด็นซับซ้อน' : 'ความเห็นแย้งในสายงาน'));
          const triggerText = (statusCat === 'RETURNED') ? 'ส่งคืนสายงานต้นทาง (กจ.5) ดำเนินการใหม่' : (statusCat === 'DONE' ? 'กลั่นกรองแล้วเสร็จ (ส่งต่อแล้ว)' : (isComplex ? 'สำนวนซับซ้อนตาม ม.24 วรรคสาม' : 'ความเห็นแย้งในสายงานต้นทาง กจ.5'));

          liveCases.push({
            id: c.id,
            subject: c.subject || 'ไม่มีระบุเรื่อง',
            allegation: c.allegation || 'ไม่มีระบุข้อกล่าวหา',
            docType: c.docType || '213',
            owner: c.owner || 'เจ้าหน้าที่ผู้รับผิดชอบ',
            ownerOrg: c.ownerOrg || 'กองบริหารคดี',
            assignedGroup: assignedGroup,
            team: team,
            teamLabel: teamLabel,
            triggerType: triggerType,
            triggerBadgeText: triggerBadgeText,
            triggerText: triggerText,
            status: c.status,
            statusText: statusText,
            statusCat: statusCat,
            slaDays: c.slaDays || 2,
            slaLimit: c.slaLimit || 5,
            accused: c.accused || [],
            trr_id: c.trr_id
          });
        });

        if (liveCases.length > 0) {
          const liveIds = new Set(liveCases.map(c => c.id));
          const preservedMocks = SUPPORT_CASES.filter(c => !liveIds.has(c.id));
          allCases = [...liveCases, ...preservedMocks];
          updateScopeGroup(selectedGroup);
        }
      } catch (err) {
        console.warn('โหลดข้อมูลจาก Supabase ไม่สำเร็จ:', err);
      }
    }

    function renderKPI() {
      const total = currentCases.length;
      const pending = currentCases.filter(c => c.statusCat === 'PENDING').length;
      const moreInfo = currentCases.filter(c => c.statusCat === 'MORE_INFO').length;
      const returned = currentCases.filter(c => c.statusCat === 'RETURNED').length;
      const done = currentCases.filter(c => c.statusCat === 'DONE').length;

      const kpis = [
        { id: 'ALL', n: total, l: 'สำนวนทั้งหมดในคิว', i: 'fa-folder-open', c: '#0F2A62' },
        { id: 'PENDING', n: pending, l: 'รอกลั่นกรอง', i: 'fa-hourglass-half', c: '#D0A830' },
        { id: 'MORE_INFO', n: moreInfo, l: 'ขอข้อมูลเพิ่มเติม', i: 'fa-file-circle-question', c: '#0284C7' },
        { id: 'RETURNED', n: returned, l: 'ส่งคืนต้นทาง (กจ.5)', i: 'fa-arrow-left-long', c: '#DC2626' },
        { id: 'DONE', n: done, l: 'กลั่นกรองแล้วเสร็จ', i: 'fa-circle-check', c: '#16A34A' }
      ];

      document.getElementById('kpiRow').innerHTML = kpis.map(k => {
        const isActive = (activeKpi === k.id);
        const cardStyle = isActive ? `style="border-color:${k.c};background:#F8FAFC;"` : '';
        return `
          <div class="col">
            <div class="card card-ecmis kpi-card h-100 ${isActive ? 'border-2 shadow-sm' : ''}" 
                 ${cardStyle}
                 onclick="filterByKPI('${k.id}')">
              <div class="card-body p-3 d-flex align-items-center justify-content-between">
                <div>
                  <div class="text-muted small mb-1">${k.l}</div>
                  <div class="h3 fw-bold mb-0" style="color:${k.c}">${k.n}</div>
                </div>
                <div class="rounded-circle p-3 d-flex align-items-center justify-content-center"
                     style="background: ${k.c}15; width:48px; height:48px;">
                  <i class="fa-solid ${k.i} fs-5" style="color:${k.c}"></i>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterByKPI(kpiId) {
      activeKpi = kpiId;
      $('#statusFilter').val(kpiId);
      renderKPI();
      renderQueue();
    }

    function renderQueue() {
      const q = ($('#searchInput').val() || '').trim().toLowerCase();
      const st = $('#statusFilter').val() || 'ALL';

      let filtered = currentCases.filter(c => {
        if (st !== 'ALL' && c.statusCat !== st) return false;
        if (!q) return true;
        const matchSubject = c.subject && c.subject.toLowerCase().includes(q);
        const matchId = c.id && c.id.toLowerCase().includes(q);
        const matchOwner = c.owner && c.owner.toLowerCase().includes(q);
        const matchOrg = c.ownerOrg && c.ownerOrg.toLowerCase().includes(q);
        const matchAccused = c.accused && c.accused.some(a => a.name && a.name.toLowerCase().includes(q));
        return matchSubject || matchId || matchOwner || matchOrg || matchAccused;
      });

      // Sorting: จัดลำดับงานที่ต้องดำเนินการก่อน (รอกลั่นกรอง) ให้อยู่ด้านบนสุดเสมอ
      filtered.sort((a, b) => {
        const priorityOrder = {
          'PENDING': 1,    // รอกลั่นกรอง (ต้องดำเนินการก่อน)
          'MORE_INFO': 2,  // รอข้อมูลเพิ่มเติม
          'RETURNED': 3,   // ส่งคืนต้นทาง
          'DONE': 4        // กลั่นกรองแล้วเสร็จ
        };
        const pA = priorityOrder[a.statusCat] || 99;
        const pB = priorityOrder[b.statusCat] || 99;
        if (pA !== pB) {
          return pA - pB;
        }

        // หากสถานะ priority เท่ากัน ให้เรียงตามคอลัมน์ที่ผู้ใช้คลิกเลือก
        let valA = a[sortField];
        let valB = b[sortField];

        if (typeof valA === 'string') {
          return sortOrder === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
        } else {
          return sortOrder === 'asc' ? (valA - valB) : (valB - valA);
        }
      });

      $('#tableSummaryText').text(`แสดง 1 ถึง ${filtered.length} จาก ${filtered.length} รายการ`);

      if (filtered.length === 0) {
        $('#myQueue').html(`
          <tr>
            <td colspan="5" class="text-center py-4 text-muted">
              <i class="fa-solid fa-folder-open fa-2x mb-2 d-block text-secondary"></i>
              ไม่พบรายการสำนวนตามเงื่อนไขที่เลือก
            </td>
          </tr>
        `);
        return;
      }

      const html = filtered.map(c => {
        const isDone = (c.statusCat === 'DONE');
        const isReturned = (c.statusCat === 'RETURNED');
        const isMoreInfo = (c.statusCat === 'MORE_INFO');
        const isReadOnlyItem = isDone || isReturned || isMoreInfo;

        // Status Badge: ใช้ Master Style .meet-badge
        let statusBadge = '';
        if (isDone) {
          statusBadge = `<span class="meet-badge meet-done"><i class="fa-solid fa-circle-check text-success me-1" style="font-size:0.5rem"></i>กลั่นกรองแล้วเสร็จ</span>`;
        } else if (isReturned) {
          statusBadge = `<span class="meet-badge meet-returned"><i class="fa-solid fa-arrow-left-long text-danger me-1" style="font-size:0.6rem"></i>ส่งคืนต้นทาง (กจ.5)</span>`;
        } else if (isMoreInfo) {
          statusBadge = `<span class="meet-badge meet-scheduled"><i class="fa-solid fa-file-circle-question me-1" style="font-size:0.65rem"></i>รอข้อมูลเพิ่ม</span>`;
        } else {
          statusBadge = `<span class="meet-badge meet-pending"><i class="fa-solid fa-hourglass-half me-1" style="font-size:0.65rem"></i>รอกลั่นกรอง</span>`;
        }

        // SLA Badge
        let slaBadge = '';
        if (isDone) {
          slaBadge = `<span class="sla sla-ok"><i class="fa-solid fa-check me-1 text-success"></i>เสร็จสิ้น</span>`;
        } else if (isReturned) {
          slaBadge = `<span class="sla sla-ok" style="background:#F1F5F9;color:#64748B"><i class="fa-solid fa-arrow-left me-1"></i>ส่งคืนแล้ว</span>`;
        } else if (isMoreInfo) {
          slaBadge = `<span class="sla sla-warn" style="background:#F0F9FF;color:#0284C7;border-color:#BAE6FD"><i class="fa-solid fa-clock me-1"></i>รอเอกสาร (${c.slaDays}/${c.slaLimit} วัน)</span>`;
        } else if (c.slaDays >= 4) {
          slaBadge = `<span class="sla sla-warn"><i class="fa-solid fa-clock me-1"></i>ใช้ไป ${c.slaDays}/${c.slaLimit} วัน</span>`;
        } else {
          slaBadge = `<span class="sla sla-ok"><i class="fa-solid fa-clock me-1"></i>ใช้ไป ${c.slaDays}/${c.slaLimit} วัน</span>`;
        }

        // Action Button: ถ้าเสร็จแล้ว / ส่งคืนแล้ว / รอข้อมูลเพิ่ม เป็น "ดูรายละเอียด"
        const actionBtn = isReadOnlyItem
          ? `<a href="support-subcommittee.html?case=${encodeURIComponent(c.id)}&readonly=true" class="btn btn-sm btn-outline-secondary px-3">
               <i class="fa-solid fa-eye me-1"></i>ดูรายละเอียด
             </a>`
          : `<a href="support-subcommittee.html?case=${encodeURIComponent(c.id)}" class="btn btn-sm btn-navy px-3">
               <i class="fa-solid fa-pen-to-square me-1"></i>ดำเนินการ
             </a>`;

        return `
          <tr>
            <td class="case-no">${c.id}</td>
            <td style="max-width:320px">
              <div class="text-truncate fw-medium" title="${c.subject}">${c.subject}</div>
              <small class="text-muted d-block text-truncate" style="font-size:0.75rem">${c.ownerOrg}</small>
            </td>
            <td>${statusBadge}</td>
            <td>${slaBadge}</td>
            <td class="text-end">
              ${actionBtn}
            </td>
          </tr>
        `;
      }).join('');

      $('#myQueue').html(html);
    }

    $(document).ready(function () {
      // ตั้งค่า Scope เริ่มต้น
      updateScopeGroup(selectedGroup);
      refreshFromSupabase();

      $('#searchInput').on('input', function () {
        renderQueue();
      });

      $('#statusFilter').on('change', function () {
        activeKpi = $(this).val();
        renderKPI();
        renderQueue();
      });

      $('#btnClearFilter').on('click', function () {
        $('#searchInput').val('');
        $('#statusFilter').val('ALL');
        activeKpi = 'ALL';
        renderKPI();
        renderQueue();
      });

      $('.sortable-header').on('click', function () {
        const field = $(this).data('sort');
        if (sortField === field) {
          sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
        } else {
          sortField = field;
          sortOrder = 'asc';
        }
        $('.sortable-header i').attr('class', 'fa-solid fa-sort ms-1');
        $(this).find('i').attr('class', `fa-solid fa-sort-${sortOrder === 'asc' ? 'up' : 'down'} ms-1`);
        renderQueue();
      });

    });
  </script>
</body>
